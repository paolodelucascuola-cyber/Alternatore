<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="QuadroSim">
<meta name="theme-color" content="#D6D9D4">
<meta name="description" content="Disegno e simulazione di schemi elettrici di comando e potenza, nel browser e su iPad.">
<title>QuadroSim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='10' fill='%23F2B300' stroke='%232C3236' stroke-width='3'/%3E%3Crect x='27' y='8' width='10' height='48' rx='5' fill='%23C8102E' transform='rotate(90 32 32)'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F2B300'/%3E%3Crect x='27' y='8' width='10' height='48' rx='5' fill='%23C8102E' transform='rotate(90 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* interfaccia */
  --plate: #D6D9D4;
  --plate-hi: #E6E8E3;
  --plate-lo: #BCC1BA;
  --text: #2C3236;
  --text-2: #5A6368;
  --btn-a: #F3F4F1;
  --btn-b: #DDE0DA;
  --btn-act: #CFD3CC;
  --chip: #E9EBE7;
  --card: #FBFBF8;
  --field: #FFFFFF;
  --hover: #ECEEEA;
  --inv-bg: #2C3236;
  --inv-fg: #FFFFFF;
  /* foglio da disegno: resta chiaro anche nel tema scuro */
  --paper: #FBFBF8;
  --ink: #2C3236;
  --ink-2: #5A6368;
  --signal: #F2B300;
  --live: #D62839;
  --neu: #1D63C8;
  --pe: #23994A;
  --handle: #C8102E;
  --ok: #1E8E4A;
  --warn: #C8660A;
  --ui: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Barlow Semi Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --pal-w: 236px;
  --bar-h: 58px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plate: #2B3034; --plate-hi: #343A3F; --plate-lo: #1D2124; --text: #E4E7E3; --text-2: #A7AFB3;
    --btn-a: #3E454A; --btn-b: #33393D; --btn-act: #272C2F; --chip: #363C41; --card: #2F3539; --field: #23282B;
    --hover: #3A4146; --inv-bg: #E4E7E3; --inv-fg: #1D2124; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plate: #2B3034; --plate-hi: #343A3F; --plate-lo: #1D2124; --text: #E4E7E3; --text-2: #A7AFB3;
  --btn-a: #3E454A; --btn-b: #33393D; --btn-act: #272C2F; --chip: #363C41; --card: #2F3539; --field: #23282B;
  --hover: #3A4146; --inv-bg: #E4E7E3; --inv-fg: #1D2124; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--plate); color: var(--text); font-family: var(--ui); -webkit-text-size-adjust: 100%; }
body { overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

#app {
  display: grid; grid-template-rows: var(--bar-h) 1fr; grid-template-columns: var(--pal-w) 1fr;
  height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- barra superiore ---------- */
#bar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px;
  background: linear-gradient(var(--plate-hi), var(--plate)); border-bottom: 1px solid var(--plate-lo);
  position: relative; z-index: 5; min-width: 0;
}
.brand { font: 700 19px/1 var(--cond); letter-spacing: .01em; margin-right: 4px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.brand svg { width: 24px; height: 24px; flex: none; }
.grp { display: flex; align-items: center; gap: 4px; }
.sep { width: 1px; align-self: stretch; margin: 12px 3px; background: var(--plate-lo); }
.btn {
  height: 40px; min-width: 40px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--plate-lo);
  background: linear-gradient(var(--btn-a), var(--btn-b)); color: var(--text); font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; white-space: nowrap;
}
.btn:active { background: var(--btn-act); }
.btn[disabled] { opacity: .38; pointer-events: none; }
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn.ico { padding: 0; width: 42px; }
.btn.on { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.seg { display: flex; border: 1px solid var(--plate-lo); border-radius: 8px; overflow: hidden; background: var(--chip); }
.seg button { height: 40px; padding: 0 12px; border: 0; background: transparent; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
.seg button + button { border-left: 1px solid var(--plate-lo); }
.seg button svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); }
.spacer { flex: 1; }
#zlab { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; color: var(--text-2); }
#simclock { font: 600 16px var(--cond); font-variant-numeric: tabular-nums; min-width: 60px; color: var(--text-2); }
body.sim .edit-only { display: none !important; }
body:not(.sim) .sim-only { display: none !important; }

/* interruttore generale: avvia e ferma la simulazione */
.mainsw { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 6px 0 2px; border: 0; background: none; cursor: pointer; font-weight: 700; font-size: 15px; color: var(--text); }
.mainsw svg { width: 46px; height: 46px; flex: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.mainsw .hd { transform-origin: 32px 32px; transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
.mainsw[aria-pressed="true"] .hd { transform: rotate(90deg); }
.mainsw .lab { display: flex; flex-direction: column; line-height: 1.1; text-align: left; white-space: nowrap; }
.mainsw .lab small { font-weight: 500; font-size: 12px; color: var(--text-2); }
@media (prefers-reduced-motion: reduce) { .mainsw .hd { transition: none; } }

/* ---------- tavolozza dei simboli ---------- */
#pal { grid-row: 2; background: var(--plate); border-right: 1px solid var(--plate-lo); display: flex; flex-direction: column; min-height: 0; z-index: 4; transition: opacity .2s; }
body.sim #pal { opacity: .4; pointer-events: none; }
#palhead { display: none; align-items: center; justify-content: space-between; padding: 8px 10px 0 12px; font: 700 16px var(--cond); }
#cats { display: flex; flex-wrap: wrap; gap: 5px; padding: 10px 10px 9px; border-bottom: 1px solid var(--plate-lo); }
#cats button { border: 1px solid var(--plate-lo); background: var(--chip); color: var(--text); border-radius: 16px; padding: 6px 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
#cats button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
#items { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 8px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-content: start; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 7px; border: 1px solid var(--plate-lo); background: var(--paper); color: var(--ink); border-radius: 8px; cursor: grab; min-height: 104px; touch-action: pan-y; }
.tile .pv { width: 100%; height: 64px; pointer-events: none; }
.tile span { font-size: 12.5px; line-height: 1.15; text-align: center; font-weight: 500; pointer-events: none; }
.tile[aria-pressed="true"] { outline: 3px solid var(--signal); outline-offset: -1px; background: #FFF6D6; }

/* ---------- foglio ---------- */
#stage { grid-row: 2; position: relative; overflow: hidden; background-color: var(--paper); touch-action: none; min-width: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
#stage.gridbg {
  background-image:
    linear-gradient(to right, rgba(44,50,54,.12) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(44,50,54,.12) 1px, transparent 1px),
    linear-gradient(to right, rgba(44,50,54,.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(44,50,54,.05) 1px, transparent 1px);
}

/* simboli (foglio, anteprime della tavolozza, stampa) */
.sch line, .sch path, .sch rect, .sch circle, .sch ellipse, .sch polyline {
  stroke: var(--ink); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.sch text { fill: var(--ink); stroke: none; font-family: var(--cond); }
.sch .thin { stroke-width: 1.1; }
.sch .dash { stroke-dasharray: 3.5 2.6; stroke-width: 1.15; }
.sch .dash.lt { stroke-width: 1; }
.sch .dsh { stroke-dasharray: 2.5 2; }
.sch .ac { stroke-width: 1.35; }
.sch .fi { fill: var(--ink); }
.sch .mush { fill: var(--handle); }
.sch .xr { stroke: var(--live); stroke-width: 2; }
.sch .fz { fill: var(--paper); }
.sch .fz.blown { stroke: var(--live); }
.sch .tripb { fill: var(--live); stroke: none; }
.sch .hb { fill: #fff; stroke-width: .8; }
.sch .hbf { fill: #F0A020; stroke: none; }
.sch .hbf.hot { fill: var(--live); }
.sch .th { fill: var(--paper); }
.sch .th.trip { stroke: var(--live); fill: #FFE1E3; }
.sch .coil { fill: var(--paper); }
.sch .coil.en { fill: #FFD9DC; stroke: var(--live); stroke-width: 2; }
.sch .coil.bad { stroke-dasharray: 3 2; }
.sch .pb { fill: #fff; stroke-width: .7; }
.sch .pbf { fill: var(--signal); stroke: none; }
.sch .lmp { fill: var(--paper); }
.sch .lmp.on.c-RD, .sch .glow.c-RD { fill: #FF4D4F; } .sch .lmp.on.c-GN, .sch .glow.c-GN { fill: #2ECC5C; }
.sch .lmp.on.c-YE, .sch .glow.c-YE { fill: #FFD21F; } .sch .lmp.on.c-WH, .sch .glow.c-WH { fill: #FFFFFF; }
.sch .lmp.on.c-BU, .sch .glow.c-BU { fill: #3D8BFF; }
.sch .lmp.dm.c-RD { fill: #FFC2C3; } .sch .lmp.dm.c-GN { fill: #BDEFC9; } .sch .lmp.dm.c-YE { fill: #FFF1B0; } .sch .lmp.dm.c-WH { fill: #F4F4F4; } .sch .lmp.dm.c-BU { fill: #C6DCFF; }
.sch .glow { stroke: none; opacity: .32; }
.sch .glow.c-WH { fill: #FFE9A8; opacity: .7; }
.sch .glow.dim { opacity: .15; }
.sch .badr { stroke: var(--live); stroke-dasharray: 3 2; }
.sch .bz { fill: var(--paper); }
.sch .bz.on { fill: #FFD21F; }
.sch .wave { animation: wv .6s ease-in-out infinite alternate; }
.sch .wave.w2 { animation-delay: .3s; }
@keyframes wv { from { opacity: .15 } to { opacity: 1 } }
.sch .pe { stroke: var(--pe); stroke-width: 2.2; }
.sch .pe2 { stroke: #F2CC00; stroke-width: 2.2; stroke-dasharray: 4 4; }
.sch .mc { fill: var(--paper); }
.sch .mc.on { fill: #E6F6EA; stroke: var(--ok); stroke-width: 2; }
.sch .mc.stall { fill: #FFE7CC; stroke: var(--warn); stroke-width: 2; }
.sch .rotor { stroke: var(--ok); stroke-width: 2.4; stroke-dasharray: 6 4.5; }
.sch .xc { fill: none; }
.sch .xc.on { fill: rgba(242,179,0,.18); }
.sch .cyb { fill: var(--paper); }
.sch .rod { fill: #9AA3A8; stroke-width: 1.2; }
.sch .lsm { fill: #fff; stroke-width: 1.1; }
.sch .lsm.act { fill: var(--signal); }
.sch .sup { fill: #fff; stroke-width: 1.8; }
.sch .sup.k-hot { fill: #8C4A2F; stroke: #8C4A2F; }
.sch .sup.k-neu { fill: var(--neu); stroke: var(--neu); }
.sch .sup.k-pe { fill: var(--pe); stroke: #F2CC00; stroke-width: 2.6; }
.sch .tmk { fill: var(--paper); }
.sch .tor { stroke-width: 1.3; }
.sch .fxm { fill: #FF3B30; stroke: #fff; stroke-width: 1; animation: blink .9s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.sch .selbox { fill: rgba(242,179,0,.14); stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 4 3; }
.sch .hlbox { fill: rgba(214,40,57,.10); stroke: var(--live); stroke-width: 2; animation: blink 1s steps(2) infinite; }
@media (prefers-reduced-motion: reduce) { .sch .fxm, .sch .hlbox, .sch .wave, .sch .w.short { animation: none; } }

/* testi del foglio */
.sch .lb { font-weight: 700; font-size: 11px; }
.sch .li { font-weight: 500; font-size: 8.6px; fill: var(--ink-2); }
.sch .tn { font-weight: 500; font-size: 7.2px; fill: #6A7377; }
.sch .ts { font-weight: 700; font-size: 7.5px; text-anchor: middle; }
.sch .tm { font-weight: 700; font-size: 16px; text-anchor: middle; }
.sch .note { font-family: var(--ui); font-weight: 500; fill: var(--ink-2); }
.sch .sn { font-weight: 700; font-size: 8.6px; fill: var(--ink-2); }
.sch .sn, .sch .lb, .sch .li, .sch .tn { paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.sch .sn.ok { fill: var(--ok); } .sch .sn.warn { fill: var(--warn); } .sch .sn.err { fill: var(--live); }

/* fili */
.sch .w { stroke: var(--ink); stroke-width: 1.6; }
.sch .wh { stroke: var(--signal); stroke-width: 8; opacity: .55; }
.sch .w.live { stroke: var(--live); }
.sch .w.neu { stroke: var(--neu); }
.sch .w.pe { stroke: var(--pe); }
.sch .w.cur { stroke-width: 3.2; }
.sch .w.short { stroke: #E0119A; stroke-width: 3.6; animation: blink .5s steps(2) infinite; }
.sch .w.brk { stroke: var(--live); stroke-dasharray: 2 4; stroke-width: 2; }
.sch .brkm { fill: #fff; stroke: var(--live); stroke-width: 1.8; }
.sch .jd { fill: var(--ink); stroke: none; }
.sch .ot { fill: #fff; stroke: #E8871E; stroke-width: 1.3; }

/* sovrapposizioni dell'editor */
#cv .ov * { vector-effect: non-scaling-stroke; }
#cv .pv-w { stroke: var(--signal); stroke-width: 3; stroke-dasharray: 6 4; fill: none; }
#cv .pv-p { fill: var(--signal); stroke: var(--ink); stroke-width: 1; }
#cv .snapmk { fill: none; stroke: var(--signal); stroke-width: 2.5; }
#cv .band { fill: rgba(242,179,0,.12); stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 5 4; }
#cv .ghost { opacity: .5; }
#cv .weh { fill: #fff; stroke: var(--signal); stroke-width: 2; }
#cv .prb { stroke: #fff; stroke-width: 2; }
#cv .prb.r { fill: var(--live); } #cv .prb.b { fill: #1A1A1A; }
#cv .prbt { font: 700 11px var(--ui); fill: #fff; stroke: none; }

/* ---------- pannelli ---------- */
.card { background: var(--card); color: var(--text); border: 1px solid var(--plate-lo); border-radius: 12px; box-shadow: 0 10px 30px rgba(20,24,26,.18), 0 2px 6px rgba(20,24,26,.1); }
#props { position: absolute; right: 12px; bottom: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; padding: 12px 14px 14px; z-index: 6; -webkit-user-select: text; user-select: text; }
#props h3 { margin: 0 0 8px; font: 700 17px var(--cond); padding-right: 30px; }
#props .x { position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--text-2); cursor: pointer; }
#props .f { display: flex; flex-direction: column; gap: 3px; margin-bottom: 9px; }
#props label { font-size: 12.5px; font-weight: 600; color: var(--text-2); }
#props input, #props select, #props textarea { height: 40px; border: 1px solid var(--plate-lo); border-radius: 7px; padding: 0 10px; background: var(--field); font-size: 16px; width: 100%; }
#props textarea { height: 76px; padding: 8px 10px; resize: vertical; }
#props .unit { display: flex; align-items: center; gap: 6px; }
#props .unit input { flex: 1; min-width: 0; }
#props .unit span { font-weight: 600; color: var(--text-2); min-width: 22px; }
#props .acts { display: flex; gap: 6px; margin-top: 6px; }
#props .acts .btn { flex: 1; padding: 0 6px; font-size: 14px; }
#props .btn.danger { color: var(--live); }
#props .note2 { font-size: 13px; color: var(--text-2); margin: 0 0 8px; line-height: 1.35; }
#props .note2.warn { color: var(--warn); }

#meter { position: absolute; right: 12px; top: 12px; width: 240px; padding: 10px; z-index: 6; background: #F2C230; color: #2C3236; border: 2px solid #2C3236; border-radius: 16px; box-shadow: 0 10px 26px rgba(20,24,26,.25); }
#meter .lcd { background: #B9C6A8; border: 2px solid #2C3236; border-radius: 6px; height: 58px; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; font: 600 32px/1 var(--cond); font-variant-numeric: tabular-nums; color: #1F2A1F; letter-spacing: .02em; }
#meter .lcd small { font-size: 18px; margin-left: 5px; }
#meter .row { display: flex; gap: 6px; margin-top: 8px; }
#meter .row button { flex: 1; height: 38px; border-radius: 19px; border: 2px solid #2C3236; background: #F7E3A1; color: #2C3236; font-weight: 700; cursor: pointer; }
#meter .row button[aria-pressed="true"] { background: #2C3236; color: #fff; }
#meter .msg { font-size: 12.5px; line-height: 1.3; margin-top: 7px; min-height: 16px; font-weight: 600; }
#meter .probes { font-size: 12.5px; font-weight: 600; margin-top: 5px; line-height: 1.3; }
#meter .probes i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 1.5px solid #fff; }

#hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; background: rgba(44,50,54,.88); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; z-index: 5; max-width: calc(100% - 360px); text-align: center; pointer-events: none; }
#hint:empty { display: none; }
#wirebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 54px; display: flex; gap: 6px; padding: 6px; z-index: 6; }
#toasts { position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 7; max-width: min(440px, calc(100% - 290px)); pointer-events: none; }
.toast { background: #2C3236; color: #fff; border-radius: 10px; padding: 9px 13px; font-size: 14px; line-height: 1.3; box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: tin .18s ease-out; }
.toast.trip { background: #7A1420; } .toast.err { background: var(--live); } .toast.warn { background: #8A4A0B; } .toast.ok { background: var(--ok); }
@keyframes tin { from { opacity: 0; transform: translateY(-6px); } }

#empty { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 40px)); padding: 22px 24px; z-index: 3; }
#empty h2 { margin: 0 0 6px; font: 700 24px var(--cond); }
#empty p { margin: 0 0 14px; line-height: 1.45; color: var(--text-2); font-size: 15.5px; }
#empty .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* menu a comparsa e finestre */
#pop { position: fixed; z-index: 30; min-width: 240px; max-width: calc(100vw - 16px); padding: 6px; }
#pop button { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 9px 12px; border: 0; background: none; border-radius: 7px; font-size: 15.5px; font-weight: 500; cursor: pointer; min-height: 44px; color: var(--text); }
#pop button:active, #pop button:hover { background: var(--hover); }
#pop button span { display: block; }
#pop button small { display: block; color: var(--text-2); font-size: 12.5px; font-weight: 400; margin-top: 1px; }
#pop button .chk { width: 18px; flex: none; text-align: center; font-weight: 700; color: var(--ok); }
#pop .hr { height: 1px; background: var(--plate-lo); margin: 4px 6px; }
#pop .ttl { font: 700 14px var(--cond); color: var(--text-2); padding: 6px 12px 3px; }
#veil { position: fixed; inset: 0; z-index: 29; background: transparent; }
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(28,32,34,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .card { width: min(580px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 20px 22px; -webkit-user-select: text; user-select: text; }
#modal h2 { margin: 0 0 10px; font: 700 23px var(--cond); }
#modal h3 { margin: 16px 0 4px; font: 700 17px var(--cond); }
#modal p, #modal li { line-height: 1.45; font-size: 15.5px; }
#modal p { margin: 0 0 8px; }
#modal ul { margin: 4px 0 8px; padding-left: 20px; }
#modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
#modal input[type=text] { width: 100%; height: 44px; border: 1px solid var(--plate-lo); border-radius: 8px; padding: 0 12px; font-size: 17px; background: var(--field); }
#modal .lst { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
#modal .it { display: flex; align-items: center; gap: 8px; border: 1px solid var(--plate-lo); border-radius: 9px; padding: 6px 6px 6px 12px; }
#modal .it > div, #modal .it .t { flex: 1; min-width: 0; display: block; }
#modal .it small { display: block; }
#modal .it b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#modal .it small { color: var(--text-2); }
#modal button.it { width: 100%; text-align: left; background: var(--field); color: var(--text); cursor: pointer; padding: 10px 12px; font: inherit; }
#modal button.it:active { background: var(--hover); }
#modal .log { font: 500 14px/1.45 var(--ui); max-height: 55vh; overflow: auto; }
#modal .log div { padding: 4px 0; border-bottom: 1px solid var(--hover); }
#modal .log span { color: var(--text-2); font-variant-numeric: tabular-nums; margin-right: 8px; }
#modal .log .trip, #modal .log .err { color: var(--live); } #modal .log .warn { color: var(--warn); }
#modal .btn.pri { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
#modal kbd { font: 600 13px var(--ui); border: 1px solid var(--plate-lo); border-radius: 4px; padding: 1px 5px; background: var(--field); }
#modal .warnbox { background: #FFF1F2; color: #5B1017; border: 1px solid #F3B7BD; border-radius: 9px; padding: 10px 12px; }
#modal .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14.5px; margin: 6px 0; }
#modal .legend i { display: inline-block; width: 22px; height: 4px; border-radius: 2px; vertical-align: 3px; margin-right: 6px; }
#fin { display: none; }

/* ---------- iPad verticale e schermi stretti ---------- */
#palbtn { display: none; }
@media (max-width: 1480px) {
  .brand .wm, .zx { display: none !important; }
  body.sim #b-file .tl, body.sim #b-ex .tl { display: none; }
}
@media (max-width: 1020px) {
  .seg button .tl, .btn .tl { display: none; }
  .mainsw .lab small { display: none; }
  .brand .wm { display: none; }
}
@media (max-width: 960px) {
  #app { grid-template-columns: 1fr; }
  #pal { position: absolute; left: 0; top: calc(var(--bar-h) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(300px, 86vw); transform: translateX(-102%); transition: transform .22s ease, opacity .2s; box-shadow: 6px 0 24px rgba(0,0,0,.2); z-index: 20; }
  body.palopen #pal { transform: none; }
  #palhead { display: flex; }
  #palbtn { display: inline-flex; }
  #stage { grid-column: 1; }
  #hint { max-width: calc(100% - 24px); }
  #props { left: 8px; right: 8px; width: auto; bottom: 8px; max-height: 48%; }
  #toasts { max-width: calc(100% - 24px); }
  body.sim #toasts { top: 150px; }
}
@media (max-width: 800px) {
  #simclock { display: none; }
  .mainsw .lab { display: none; }
}
@media (max-width: 600px) {
  .hide-s { display: none !important; }
  #bar { overflow-x: auto; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar > * { flex: none; }
  .mainsw { position: sticky; right: 0; background: var(--plate); padding-left: 6px; }
}
/* dentro claude.ai la cornice gestisce già i margini di sicurezza */
body.embed #app { height: 100%; padding-top: 0; }

/* ---------- stampa ---------- */
#print { display: none; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  html, body { background: #fff; height: auto; overflow: visible; }
  #app, #pop, #veil, #modal { display: none !important; }
  #print { display: block; }
  #print svg { width: 100%; height: auto; max-height: 180mm; }
  #print .foot { display: flex; justify-content: space-between; border-top: 1.5px solid #000; margin-top: 4mm; padding-top: 2mm; font: 600 11pt var(--ui); color: #000; }
}

</style>

<script>
'use strict';
/* =========================================================================
   QuadroSim — core
   Simboli IEC, modelli elettrici, netlist geometrica, risolutore nodale
   in fasori (MNA complesso) e simulazione a passo fisso.
   ========================================================================= */

const G = 10;
const snap = v => Math.round(v / G) * G;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rotPt(x, y, r) {
  switch (r) { case 90: return [-y, x]; case 180: return [-x, -y]; case 270: return [y, -x]; default: return [x, y]; }
}
function uid(p) { return (p || 'c') + Math.random().toString(36).slice(2, 9); }
const f2 = n => Math.round(n * 100) / 100;
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
const cl = c => (c ? ` class="${c}"` : '');
const L = (x1, y1, x2, y2, c) => `<line x1="${f2(x1)}" y1="${f2(y1)}" x2="${f2(x2)}" y2="${f2(y2)}"${cl(c)}/>`;
const P = (d, c) => `<path d="${d}"${cl(c)}/>`;
const RC = (x, y, w, h, c) => `<rect x="${f2(x)}" y="${f2(y)}" width="${f2(w)}" height="${f2(h)}"${cl(c)}/>`;
const CI = (x, y, r, c) => `<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}"${cl(c)}/>`;
const EL = (x, y, rx, ry, c) => `<ellipse cx="${f2(x)}" cy="${f2(y)}" rx="${f2(rx)}" ry="${f2(ry)}"${cl(c)}/>`;
const dashPath = (pts, c) => P('M' + pts.map(p => f2(p[0]) + ',' + f2(p[1])).join(' L'), c || 'dash');
const tk = t => String(t == null ? '' : t).trim().toUpperCase();
const fmtN = n => String(Math.round(n * 100) / 100).replace('.', ',');

/* ---------- numeri complessi ---------- */
const cplx = (re, im) => ({ re, im });
const polar = (m, d) => cplx(m * Math.cos(d * Math.PI / 180), m * Math.sin(d * Math.PI / 180));
const cabs = z => Math.hypot(z.re, z.im);
const csub = (a, b) => cplx(a.re - b.re, a.im - b.im);
const carg = z => Math.atan2(z.im, z.re) * 180 / Math.PI;

/* ---------- potenziali di alimentazione (sistema TN-S 400/230 V, 50 Hz) ---------- */
const POTS = {
  L1: { v: polar(230, 0), label: 'L1', kind: 'hot' },
  L2: { v: polar(230, -120), label: 'L2', kind: 'hot' },
  L3: { v: polar(230, 120), label: 'L3', kind: 'hot' },
  N: { v: cplx(0, 0), label: 'N', kind: 'neu' },
  PE: { v: cplx(0, 0), label: 'PE', kind: 'pe' },
  P24: { v: cplx(24, 0), label: '+24 V', kind: 'hot' },
  M0: { v: cplx(0, 0), label: '0 V', kind: 'neu' },
};

const VN_OPTS = [['any', 'Qualsiasi'], ['24', '24 V'], ['48', '48 V'], ['110', '110 V'], ['230', '230 V'], ['400', '400 V']];
const VN_FIELD = { k: 'Vn', label: 'Tensione nominale', kind: 'sel', opts: VN_OPTS };
const vnum = Vn => (Vn === 'any' ? 0 : +Vn);
const loadR = (Vn, VA) => { const v = vnum(Vn) || 230; return v * v / VA; };
const LAMP_COLS = [['RD', 'Rosso'], ['GN', 'Verde'], ['YE', 'Giallo'], ['WH', 'Bianco'], ['BU', 'Blu']];
const ON0_FIELD = { k: 'on0', label: 'Posizione all\'avvio', kind: 'bool', yes: 'Chiuso', no: 'Aperto' };

/* ---------- registro dei tipi ---------- */
const TYPES = {};
function def(t, o) {
  o.type = t; o.props = o.props || {}; o.fields = o.fields || []; o.terms = o.terms || [];
  TYPES[t] = o; return o;
}
const CATS = [
  { id: 'alim', name: 'Alimentazione' },
  { id: 'prot', name: 'Protezione e manovra' },
  { id: 'cmd', name: 'Comandi' },
  { id: 'rel', name: 'Contattori e relè' },
  { id: 'load', name: 'Utilizzatori' },
  { id: 'pneu', name: 'Elettropneumatica' },
  { id: 'misc', name: 'Varie' },
];
const PALETTE = [];
function pal(cat, type, label, props) { PALETTE.push({ cat, type, label: label || TYPES[type].name, props: props || null }); }

/* ---------- primitive dei contatti (asse verticale, polo in x) ---------- */
function cNO(x, closed) {
  return L(x, -30, x, -10) + L(x, 10, x, 30) + (closed ? L(x, 10, x, -10, 'bl cl') : L(x, 10, x - 11, -12, 'bl'));
}
function cNC(x, closed) {
  return L(x, -30, x, -10) + L(x, -10, x + 9, -10) + L(x, 10, x, 30) +
    (closed ? L(x, 10, x + 11, -13, 'bl cl') : L(x, 10, x + 14, -3, 'bl'));
}
function cCO(toNO) {
  // comune in basso (0,30); NA in alto a sinistra (-10,-30); NC in alto a destra (10,-30)
  return L(0, 30, 0, 10) + L(-10, -30, -10, -10) + L(10, -30, 10, -10) + L(10, -10, 4, -10) +
    (toNO ? L(0, 10, -10, -10, 'bl cl') : L(0, 10, 7, -12, 'bl cl'));
}
const midNO = (x, closed) => (closed ? [x, 0] : [x - 5.5, -1]);
const midNC = (x, closed) => (closed ? [x + 5.5, -1.5] : [x + 7, 3.5]);
const markC = x => P(`M${x - 3.5},-10 A3.5,3.5 0 0 0 ${x + 3.5},-10`); // funzione contattore
const markB = x => L(x - 3.5, -13.5, x + 3.5, -6.5) + L(x - 3.5, -6.5, x + 3.5, -13.5); // interruttore
const markD = x => L(x - 4.5, -10, x + 4.5, -10); // sezionatore

function glyph(kind, ax) {
  switch (kind) {
    case 'push': return P(`M${ax + 5},-6 H${ax} V6 H${ax + 5}`, 'ac');
    case 'mush': return P(`M${ax},-8 A8,8 0 0 0 ${ax},8 Z`, 'mush') + L(ax, -8, ax, 8, 'ac');
    case 'sel': return P(`M${ax - 4},-7 H${ax} V7 H${ax + 4}`, 'ac');
    case 'hand': return L(ax, -6, ax, 6, 'ac');
    case 'therm': return RC(ax - 11, -7, 11, 14, 'ac') + P(`M${ax - 8},5 V0 H${ax - 3} V-5`, 'ac');
    case 'sens': return RC(ax - 13, -7, 13, 14, 'ac');
    case 'rot': return CI(ax - 5, 0, 5, 'ac') + L(ax - 10, 0, ax, 0, 'ac');
    default: return '';
  }
}
const SENS_OPTS = [['P', 'Pressostato'], ['θ', 'Termostato'], ['L', 'Livello (galleggiante)'], ['F', 'Fotocellula'], ['X', 'Prossimità']];

/* ---------- alimentazioni ---------- */
def('sup', {
  name: 'Alimentazione', cat: 'alim', prefix: '', noTag: true, fam: 'sup',
  terms: [{ id: 'p', x: 0, y: 0, n: '' }], box: [-12, -30, 12, 3], props: { pot: 'L1' },
  fields: [{ k: 'pot', label: 'Conduttore', kind: 'sel', opts: Object.keys(POTS).map(k => [k, POTS[k].label]) }],
  draw(c) {
    const p = POTS[c.props.pot] || POTS.L1;
    return { g: L(0, 0, 0, -9) + CI(0, -14, 5, 'sup k-' + p.kind), tx: [{ x: 0, y: -23, ry: -14, s: p.label, cls: 'lb', side: 1 }] };
  },
  model(c, S, E) { E.Rn(E.net(c, 'p'), E.pot(c.props.pot), 0.001, 'sup:' + c.id, E.vtx(c, 'p'), -1); },
});
const GRID_P = ['L1', 'L2', 'L3', 'N', 'PE'];
def('grid', {
  name: 'Rete 3F+N+PE', cat: 'alim', prefix: '', noTag: true, fam: 'sup',
  terms: GRID_P.map((id, i) => ({ id, x: i * 20, y: 0, n: '' })), box: [-12, -30, 92, 3],
  draw() {
    let g = ''; const tx = [];
    GRID_P.forEach((p, i) => { const x = i * 20; g += L(x, 0, x, -9) + CI(x, -14, 5, 'sup k-' + POTS[p].kind); tx.push({ x, y: -23, rx: x, ry: -14, s: p, cls: 'lb', side: 1 }); });
    return { g, tx };
  },
  model(c, S, E) { for (const p of GRID_P) E.Rn(E.net(c, p), E.pot(p), 0.001, 'sup:' + c.id + ':' + p, E.vtx(c, p), -1); },
});

function xfModel(c, S, E, ph, pc, sh, sc, Vp) {
  const ld = S.ld[c.id]; if (ld && ld.burnt) return;
  const Vs = +c.props.Vs, Sn = +c.props.Sn || 100, k = Vs / Vp;
  const nph = E.net(c, ph), npc = E.net(c, pc), nsh = E.net(c, sh), nsc = E.net(c, sc);
  E.Rn(nph, npc, Vp * Vp / (0.03 * Sn), c.id + ':mag', E.vtx(c, ph), E.vtx(c, pc));
  const a = E.node(), b = E.node(), m = E.node(), s0 = E.node();
  E.Rn(nph, a, 0.001, c.id + ':ph', E.vtx(c, ph), -1);
  E.Rn(npc, b, 0.001, c.id + ':pc', E.vtx(c, pc), -1);
  E.XF(b, a, s0, m, k, c.id + ':xf');
  E.Rn(m, nsh, Math.max(0.02, 0.02 * Vs * Vs / Sn), c.id + ':sh', -1, E.vtx(c, sh));
  E.Rn(s0, nsc, 0.001, c.id + ':sc', -1, E.vtx(c, sc));
  S.xfn[c.id] = { m, s0 };
}

/* ---------- protezione e manovra ---------- */
function polesTerms(xs, nums) {
  const t = [];
  xs.forEach((x, i) => {
    t.push({ id: 't' + i, x, y: -30, n: nums ? nums[i][0] : String(2 * i + 1) });
    t.push({ id: 'b' + i, x, y: 30, n: nums ? nums[i][1] : String(2 * i + 2) });
  });
  return t;
}
function fuseSym(x, blown) {
  if (!blown) return RC(x - 5, -15, 10, 30, 'fz') + L(x, -30, x, 30);
  return RC(x - 5, -15, 10, 30, 'fz blown') + L(x, -30, x, -15) + L(x, 15, x, 30) + L(x, -15, x, -5) + L(x, 5, x, 15) +
    L(x - 7, -7, x + 7, 7, 'xr') + L(x - 7, 7, x + 7, -7, 'xr');
}
function defFuse(t, name, xs) {
  def(t, {
    name, cat: 'prot', prefix: 'FU', fam: 'prot', prot: 'fuse', poles: xs,
    terms: polesTerms(xs), box: [xs[0] - 10, -32, xs[xs.length - 1] + 10, 32], props: { In: 10 },
    fields: [{ k: 'In', label: 'Corrente nominale', kind: 'num', unit: 'A', min: 0.5, max: 250 }],
    info: c => fmtN(c.props.In) + ' A',
    draw(c, v) {
      let g = ''; xs.forEach((x, i) => { g += fuseSym(x, v && v.blown[i]); });
      if (xs.length > 1) g += dashPath([[xs[0] - 5, 0], [xs[xs.length - 1] + 5, 0]], 'dash lt');
      return { g, tx: [] };
    },
    model(c, S, E) { const st = S.pd[c.id]; xs.forEach((x, i) => { if (!st.blown[i]) E.R(c, 't' + i, 'b' + i, 0.001, c.id + ':' + i); }); },
  });
}

function switchGeom(xs, closed, mark, ax, glyphs) {
  let g = ''; const mids = [];
  for (const x of xs) {
    g += cNO(x, closed);
    if (mark === 'B') g += markB(x); else if (mark === 'D') g += markD(x); else if (mark === 'C') g += markC(x);
    mids.push(midNO(x, closed));
  }
  g += dashPath([[ax, 0], ...mids]) + glyphs;
  return g;
}
function tmBoxes(ax) { // sganciatori termico e magnetico
  return RC(ax - 11, -7, 11, 14, 'ac') + P(`M${ax - 8},5 V0 H${ax - 3} V-5`, 'ac') +
    RC(ax - 24, -7, 11, 14, 'ac') + P(`M${ax - 21},-4 L${ax - 16},0 L${ax - 21},4`, 'ac');
}
function defBreaker(t, name, xs, nums) {

  def(t, {
    name, cat: 'prot', prefix: 'Q', fam: 'prot', prot: 'mt', poles: xs, sim: 'prot',
    terms: polesTerms(xs, nums), box: [ax - 26, -32, xs[xs.length - 1] + 8, 32], props: { In: 16, curve: 'C', on0: true },
    fields: [{ k: 'In', label: 'Corrente nominale', kind: 'num', unit: 'A', min: 0.5, max: 125 },
      { k: 'curve', label: 'Curva di intervento', kind: 'sel', opts: [['B', 'B (3–5 In)'], ['C', 'C (5–10 In)'], ['D', 'D (10–20 In)']] }, ON0_FIELD],
    info: c => c.props.curve + fmtN(c.props.In),
    draw(c, v) {
      const on = v ? v.on : false;
      return { g: switchGeom(xs, on, 'B', ax, tmBoxes(ax)) + (v && v.trip ? CI(ax - 12, -15, 5, 'tripb') : ''), tx: [] };
    },
    model(c, S, E) { if (S.pd[c.id].on) xs.forEach((x, i) => E.R(c, 't' + i, 'b' + i, 0.001, c.id + ':' + i)); },
  });
}

function heatBar(x, h) {
  h = clamp(h || 0, 0, 1);
  h = Math.round(h * 40) / 40;
  return RC(x, -14, 5, 28, 'hb') + (h > 0.002 ? RC(x, 14 - 28 * h, 5, 28 * h, h > 0.75 ? 'hbf hot' : 'hbf') : '');
}

function defRCD(t, name, xs, nums) {

    terms: polesTerms(xs, nums), box: [ax - 46, -32, xs[xs.length - 1] + 12, 32], props: { In: 16, Idn: 0.03, mt: true, on0: true },
    fields: [{ k: 'Idn', label: 'Corrente differenziale IΔn', kind: 'sel', num: 1, opts: [[0.01, '10 mA'], [0.03, '30 mA'], [0.3, '300 mA'], [0.5, '500 mA']] },
      { k: 'mt', label: 'Tipo', kind: 'bool', yes: 'Magnetotermico differenziale', no: 'Differenziale puro' },

}

function defContact(t, o) {
  const kind = o.kind;
  const terms = kind === 'CO'
    ? [{ id: 'c', x: 0, y: 30 }, { id: 'no', x: -10, y: -30 }, { id: 'nc', x: 10, y: -30 }]
    : [{ id: 'a', x: 0, y: -30 }, { id: 'b', x: 0, y: 30 }];
  const hasAct = o.act && o.act !== 'lim' && o.act !== 'delay';
  def(t, {
    name: o.name, cat: o.cat, prefix: o.prefix, fam: 'contact', kind, act: o.act, man: o.man || null,
    delayed: !!o.delayed, fixedNums: o.nums || null, link: o.link || null, sim: o.man ? o.man : null,
    terms, box: [hasAct ? -38 : o.act === 'delay' ? -26 : -18, -32, 16, 32], props: o.props || {}, fields: o.fields || [],
    info: o.info || null,
    draw(c, v, ctx) {
      const act = v ? !!v.act : false;
      let g = '', m;
      if (kind === 'NO') { const cl2 = v ? v.closed : false; g += cNO(0, cl2); m = midNO(0, cl2); }
      else if (kind === 'NC') { const cl2 = v ? v.closed : true; g += cNC(0, cl2); m = midNC(0, cl2); }
      else { const toNO = v ? v.closed : false; g += cCO(toNO); m = toNO ? [-5, 0] : [3.5, -1]; }
      if (o.mark === 'C') g += markC(0);
      const tx = [];
      if (o.act === 'lim') g += P(`M${f2(m[0] - 1)},${f2(m[1] - 5)} L${f2(m[0] - 10)},${f2(m[1])} L${f2(m[0] - 1)},${f2(m[1] + 5)} Z`, 'fi');
      else if (o.act === 'delay') {
        const off = ctx && ctx.delayKind === 'tof';
        g += L(m[0], m[1], m[0] - 8, m[1]) + P(`M${f2(m[0] - 8)},${f2(m[1] - 6)} A6,6 0 0 ${off ? 1 : 0} ${f2(m[0] - 8)},${f2(m[1] + 6)}`);
      } else if (o.act) {
        const ax = -22 + (act && o.man === 'press' ? 3 : 0);
        g += L(ax, 0, m[0], m[1], 'dash') + glyph(o.act, ax);
        if (o.act === 'sens') tx.push({ x: ax - 6.5, y: 3.5, s: c.props.sk || 'P', cls: 'ts' });
      }
      if (v && v.fx) g += CI(8, 0, 4, 'fxm');
      return { g, tx };
    },
    model(c, S, E) {
      if (kind === 'CO') {
        const fx = S.fx[c.id];
        if (fx === 'stuck0') return;
        const toNO = fx === 'stuck1' ? true : actuated(S, c);
        E.R(c, 'c', toNO ? 'no' : 'nc', 0.01, c.id);
      } else if (contactClosed(S, c)) E.R(c, 'a', 'b', 0.01, c.id);
    },
  });
}

function defCoil(t, o) {
  const tim = o.variant === 'ton' || o.variant === 'tof';
  def(t, {
    name: o.name, cat: o.cat || 'rel', prefix: o.prefix, fam: 'coil', variant: o.variant,
    terms: [{ id: 'a1', x: 0, y: -30, n: 'A1' }, { id: 'a2', x: 0, y: 30, n: 'A2' }],
    box: [tim ? -26 : -14, -32, 14, 32],
    props: Object.assign({ Vn: 'any' }, tim ? { t: 3 } : {}),
    fields: [VN_FIELD].concat(tim ? [{ k: 't', label: 'Tempo di ritardo', kind: 'num', unit: 's', min: 0.1, max: 3600, step: 0.1 }] : []),
    info: c => (tim ? fmtN(c.props.t) + ' s' : ''),
    draw(c, v) {
      const en = v && v.en, bad = v && (v.burnt || v.fx);
      let g = L(0, -30, 0, -8) + L(0, 8, 0, 30) + RC(-12, -8, 24, 16, 'coil' + (en ? ' en' : '') + (bad ? ' bad' : ''));
      if (o.variant === 'ton') g += RC(-24, -8, 12, 16) + L(-24, -8, -12, 8, 'thin') + L(-24, 8, -12, -8, 'thin');
      if (o.variant === 'tof') g += RC(-24, -8, 12, 16, 'fi');
      if (o.variant === 'pp') g += P('M-8,5 H-3 V-4 H3 V5 H8', 'thin');

/* =========================================================================
   Geometria del documento
   ========================================================================= */
function termPos(c, t) { const [x, y] = rotPt(t.x, t.y, c.rot || 0); return [c.x + x, c.y + y]; }
function compBox(c) {
  const ty = TYPES[c.type]; const b = ty.boxOf ? ty.boxOf(c) : ty.box;
  if (ty.norot) return [c.x + b[0], c.y + b[1], c.x + b[2], c.y + b[3]];
  const p = [rotPt(b[0], b[1], c.rot || 0), rotPt(b[2], b[3], c.rot || 0)];
  return [c.x + Math.min(p[0][0], p[1][0]), c.y + Math.min(p[0][1], p[1][1]), c.x + Math.max(p[0][0], p[1][0]), c.y + Math.max(p[0][1], p[1][1])];
}
function onSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  if (l2 === 0) return Math.abs(px - ax) < 0.5 && Math.abs(py - ay) < 0.5 ? 0 : -1;
  const t = ((px - ax) * dx + (py - ay) * dy) / l2;
  if (t < -1e-9 || t > 1 + 1e-9) return -1;
  if (Math.abs(ax + t * dx - px) > 0.5 || Math.abs(ay + t * dy - py) > 0.5) return -1;
  return t;
}

/* Netlist geometrica: i fili si collegano solo agli estremi (o dove un estremo
   cade su un altro filo, giunzione a T); due fili che si incrociano non sono collegati. */
function buildNet(doc, broken) {
  const vKey = new Map(), vPos = [];
  const vtx = (x, y) => {
    x = Math.round(x * 10) / 10; y = Math.round(y * 10) / 10;
    const k = x + ',' + y; let i = vKey.get(k);
    if (i === undefined) { i = vPos.length; vKey.set(k, i); vPos.push([x, y]); }
    return i;
  };
  const termV = {}, attach = [], tcount = new Map();
  for (const c of doc.comps) {
    const ty = TYPES[c.type]; if (!ty || !ty.terms.length) continue;
    const m = termV[c.id] = {};
    for (const t of ty.terms) { const [x, y] = termPos(c, t); const v = vtx(x, y); m[t.id] = v; attach.push([x, y]); tcount.set(v, (tcount.get(v) || 0) + 1); }
  }
  const wires = doc.wires.filter(w => !(broken && broken.has(w.id)) && w.pts.length > 1);
  for (const w of wires) { attach.push(w.pts[0], w.pts[w.pts.length - 1]); }
  const edges = [];
  for (const w of wires) {
    const p = w.pts;
    for (let i = 0; i < p.length - 1; i++) {
      const [ax, ay] = p[i], [bx, by] = p[i + 1];
      const pts = [[0, ax, ay], [1, bx, by]];
      for (const q of attach) { const t = onSeg(q[0], q[1], ax, ay, bx, by); if (t > 1e-9 && t < 1 - 1e-9) pts.push([t, q[0], q[1]]); }
      pts.sort((u, v) => u[0] - v[0]);
      for (let j = 0; j < pts.length - 1; j++) {
        const va = vtx(pts[j][1], pts[j][2]), vb = vtx(pts[j + 1][1], pts[j + 1][2]);
        if (va !== vb) edges.push({ w: w.id, a: va, b: vb });
      }
    }
  }
  const par = vPos.map((_, i) => i);
  const find = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  for (const e of edges) { const ra = find(e.a), rb = find(e.b); if (ra !== rb) par[ra] = rb; }
  const netOf = new Int32Array(vPos.length), idx = new Map(); let nNets = 0;
  for (let i = 0; i < vPos.length; i++) { const r = find(i); let n = idx.get(r); if (n === undefined) { n = nNets++; idx.set(r, n); } netOf[i] = n; }
  const tn = {};
  for (const id in termV) { tn[id] = {}; for (const t in termV[id]) tn[id][t] = netOf[termV[id][t]]; }
  const deg = new Int32Array(vPos.length); for (const e of edges) { deg[e.a]++; deg[e.b]++; }
  return { vPos, vKey, edges, netOf, nNets, tn, termV, deg, tcount };
}

/* =========================================================================
   Risolutore nodale modificato (fasori complessi)
   ========================================================================= */
function gaussC(Ar, Ai, br, bi, N) {
  for (let col = 0; col < N; col++) {
    let piv = col, best = -1;
    for (let r = col; r < N; r++) { const m = Ar[r * N + col] ** 2 + Ai[r * N + col] ** 2; if (m > best) { best = m; piv = r; } }
    if (best < 1e-40) continue;
    if (piv !== col) {
      for (let c = col; c < N; c++) {
        const a = piv * N + c, b = col * N + c;
        let t = Ar[a]; Ar[a] = Ar[b]; Ar[b] = t; t = Ai[a]; Ai[a] = Ai[b]; Ai[b] = t;
      }
      let t = br[piv]; br[piv] = br[col]; br[col] = t; t = bi[piv]; bi[piv] = bi[col]; bi[col] = t;
    }
    const pr = Ar[col * N + col], pi = Ai[col * N + col], den = pr * pr + pi * pi, ir = pr / den, ii = -pi / den;
    for (let r = col + 1; r < N; r++) {
      const xr = Ar[r * N + col], xi = Ai[r * N + col];
      if (xr === 0 && xi === 0) continue;
      const fr = xr * ir - xi * ii, fi = xr * ii + xi * ir;
      for (let c = col; c < N; c++) {
        const ar = Ar[col * N + c], ai = Ai[col * N + c];
        if (ar === 0 && ai === 0) continue;
        Ar[r * N + c] -= fr * ar - fi * ai; Ai[r * N + c] -= fr * ai + fi * ar;
      }
      br[r] -= fr * br[col] - fi * bi[col]; bi[r] -= fr * bi[col] + fi * br[col];
    }
  }
  for (let r = N - 1; r >= 0; r--) {
    let sr = br[r], si = bi[r];
    for (let c = r + 1; c < N; c++) {
      const ar = Ar[r * N + c], ai = Ai[r * N + c];
      if (ar === 0 && ai === 0) continue;
      sr -= ar * br[c] - ai * bi[c]; si -= ar * bi[c] + ai * br[c];
    }
    const pr = Ar[r * N + r], pi = Ai[r * N + r], den = pr * pr + pi * pi;
    if (den < 1e-40) { br[r] = 0; bi[r] = 0; continue; }
    br[r] = (sr * pr + si * pi) / den; bi[r] = (si * pr - sr * pi) / den;
  }
}
/* rami: R {a,b,g}  V {a,b,re,im} (a = +)  XF {p1,p2,s1,s2,k}: V(s2)-V(s1) = k(V(p2)-V(p1)) */
function solveMNA(nNodes, br, inj) {
  const gnd = nNodes, par = new Int32Array(nNodes + 1);
  for (let i = 0; i <= nNodes; i++) par[i] = i;
  const find = i => { while (par[i] !== i) { par[i] = par[par[i]]; i = par[i]; } return i; };
  const uni = (a, b) => { a = find(a < 0 ? gnd : a); b = find(b < 0 ? gnd : b); if (a !== b) par[a] = b; };
  for (const b of br) {
    if (b.t === 'XF') { uni(b.p1, b.p2); uni(b.p1, b.s1); uni(b.s1, b.s2); } else uni(b.a, b.b);
  }
  const Vre = new Float64Array(nNodes), Vim = new Float64Array(nNodes);
  const groups = new Map();
  const gOf = r => { let g = groups.get(r); if (!g) { g = { br: [], src: false, nodes: [] }; groups.set(r, g); } return g; };
  for (let i = 0; i < br.length; i++) {
    const b = br[i], n0 = b.t === 'XF' ? b.p1 : b.a;
    const g = gOf(find(n0 < 0 ? gnd : n0)); g.br.push(i); if (b.t !== 'R') g.src = true;
  }
  if (inj) for (const k in inj) gOf(find(+k)).src = true;
  for (let n = 0; n < nNodes; n++) { const g = groups.get(find(n)); if (g) g.nodes.push(n); }
  for (const g of groups.values()) {
    if (!g.src) continue;
    const nodes = g.nodes, li = new Map(); nodes.forEach((n, i) => li.set(n, i));
    const src = g.br.filter(i => br[i].t !== 'R');
    const n = nodes.length, N = n + src.length;
    if (!N) continue;
    const Ar = new Float64Array(N * N), Ai = new Float64Array(N * N), br2 = new Float64Array(N), bi2 = new Float64Array(N);
    const ix = x => (x < 0 ? -1 : li.get(x));
    for (let i = 0; i < n; i++) Ar[i * N + i] += 1e-9;
    let k = n;
    for (const bi of g.br) {
      const b = br[bi];
      if (b.t === 'R') {
        const a = ix(b.a), c = ix(b.b), gg = b.g;
        if (a >= 0) Ar[a * N + a] += gg;
        if (c >= 0) Ar[c * N + c] += gg;
        if (a >= 0 && c >= 0) { Ar[a * N + c] -= gg; Ar[c * N + a] -= gg; }
      } else if (b.t === 'V') {
        const a = ix(b.a), c = ix(b.b);

}

/* ---------- meccanica: relè, temporizzatori, cilindri ---------- */
function mechStep(S, dt) {
  let ch = false;
  for (const k in S.co) {
    const co = S.co[k], T = +co.comp.props.t || 0, a0 = co.act, d0 = co.dact;
    switch (co.variant) {
      case 'ton':
        if (co.en) { co.act = true; co.acc += dt; co.dact = co.acc >= T; if (!co.dact) S.anim = true; }
        else { co.act = false; co.acc = 0; co.dact = false; }
        break;
      case 'tof':
        if (co.en) { co.act = true; co.dact = true; co.acc = 0; }
        else { co.act = false; if (co.dact) { co.acc += dt; S.anim = true; if (co.acc >= T) { co.dact = false; co.acc = 0; } } }
        break;
      case 'pp':
        if (co.en && !co.prev) co.act = !co.act;
        co.prev = co.en; co.dact = co.act;
        break;
      default: co.act = co.en; co.dact = co.en;
    }
    if (co.act !== a0 || co.dact !== d0) ch = true;
  }
  return ch;
}
function cylStep(S, dt) {
  let ch = false;
  for (const c of S.cyls) {
    const cy = S.cy[tk(c.tag)], p = c.props;
    if (!cy) continue;
    const on = t => { const co = String(t || '').trim() && S.co[tk(t)]; return !!(co && co.act); };
    const plus = on(p.yp), minus = on(p.ym);
    let dir = 0;
    if (plus && !minus) dir = 1; else if (minus && !plus) dir = -1; else if (!plus && !minus && !String(p.ym || '').trim()) dir = -1;
    const old = cy.pos;
    cy.pos = clamp(cy.pos + dir * dt / Math.max(0.1, +p.ts || 2), 0, 1);
    if (cy.pos !== old) { ch = true; S.anim = true; }
    if ((old <= 0.02) !== (cy.pos <= 0.02) || (old >= 0.98) !== (cy.pos >= 0.98)) S.dirty = true;
  }
  return ch;
}

function simStep(S, dt) {
  if (S.halt) return false;
  S.t += dt; S.anim = false;
  let ch = false;
  if (S.dirty) { solveProtect(S); ch = true; if (S.halt) return true; }
  thermalStep(S, dt);
  if (evalLoads(S, dt)) ch = true;
  if (mechStep(S, dt)) { S.dirty = true; ch = true; }
  if (cylStep(S, dt)) ch = true;
  for (const c of S.motors) if (S.mo[c.id].moving) S.anim = true;
  return ch || S.dirty || S.anim;
}

/* ---------- azioni dell'utente in simulazione ---------- */
function simPress(S, c, down) { const k = tk(c.tag); if (!!S.man[k] !== down) { S.man[k] = down; S.dirty = true; } }
function simToggle(S, c) { const k = tk(c.tag); S.man[k] = !S.man[k]; S.dirty = true; }
function simProtTap(S, c) {
  const ty = TYPES[c.type], st = S.pd[c.id];
  if (!st) return null;
  if (ty.prot === 'fuse') {
    if (st.blown.some(b => b)) { st.blown = st.blown.map(() => false); st.hp = [0, 0, 0, 0]; S.dirty = true; evt(S, `${tagOf(c)}: fusibile sostituito`); return 'Fusibile sostituito'; }
    return 'Il fusibile è integro';
  }
  if (ty.prot === 'ft') {
    if (!st.trip) return 'Il relè termico non è intervenuto';
    if (st.heat > 0.6) return 'Aspetta che il relè termico si raffreddi, poi riarmalo';
    st.trip = false; S.dirty = true; evt(S, `${tagOf(c)}: relè termico riarmato`); return 'Relè termico riarmato';
  }
  if (!st.on && st.trip && st.heat > 0.6) return 'Aspetta che lo sganciatore termico si raffreddi, poi richiudi';
  st.on = !st.on; if (st.on) st.trip = false;
  S.dirty = true; evt(S, `${tagOf(c)}: ${st.on ? 'chiuso' : 'aperto'}`);
  return null;
}
function simTest(S, c) { const st = S.pd[c.id]; if (st && st.on) applyTrip(S, { c, how: 'test' }); }
function setWireBreak(S, wid, on) { if (on) S.wfx.add(wid); else S.wfx.delete(wid); S.NL = buildNet(S.doc, S.wfx); S.dirty = true; }

  for (const c of S.motors) Object.assign(S.mo[c.id], { ol: false, lock: false, earth: 0, openW: false, touch: false, bodyLv: -1 });

}
function faultDesc(S, kind, c) {
  const ty = TYPES[c.type];
  switch (kind) {
    case 'stuck0': return `${ty.name} ${tagOf(c)} interrotto (non chiude mai)`;
    case 'stuck1': return `${ty.name} ${tagOf(c)} incollato (resta sempre chiuso)`;
    case 'open': return `${ty.name} ${tagOf(c)} interrotto`;
    default: return ty.name + ' ' + tagOf(c);
  }
}
function randomFault(S) {
  const cands = [];
  for (const c of S.doc.comps) {
    const ty = TYPES[c.type];
    if (ty.fam === 'contact' && ty.kind !== 'INV') cands.push({ c, kind: ty.kind === 'NC' ? 'stuck0' : Math.random() < 0.75 ? 'stuck0' : 'stuck1' });
    else if (ty.fam === 'coil' || ty.fam === 'lamp' || ty.fam === 'term') cands.push({ c, kind: 'open' });
  }
  for (const w of S.doc.wires) cands.push({ w, kind: 'wire' }, { w, kind: 'wire' });
  if (!cands.length) return null;
  const f = cands[Math.floor(Math.random() * cands.length)];
  if (f.kind === 'wire') { setWireBreak(S, f.w.id, true); S.hidden = { wire: f.w.id, desc: 'un filo interrotto' }; }
  else { S.fx[f.c.id] = f.kind; S.dirty = true; S.hidden = { id: f.c.id, desc: faultDesc(S, f.kind, f.c) }; }

}

/* ---------- tester ---------- */
function meterRead(S, vA, vB, mode) {
  if (vA == null || vB == null || !S.sol) return null;
  const nA = S.NL.netOf[vA], nB = S.NL.netOf[vB];
  const V = cabs(csub(nv(S, nA), nv(S, nB)));
  if (mode === 'V') return { V };
  if (V > 2) return { err: 'Tensione presente: togli l\'alimentazione prima di misurare la resistenza.', V };
  if (nA === nB) return { R: 0 };
  const br = S.br.filter(b => b.t === 'R' && !(b.key && String(b.key).startsWith('sup:')));
  const inj = {}; inj[nA] = 1; inj[nB] = -1;
  const sol = solveMNA(S.nNodes, br, inj);
  return { R: Math.abs(sol.Vre[nA] - sol.Vre[nB]) };
}

/* ---------- controllo dello schema ---------- */
function checkDoc(doc) {
  const out = [], NL = buildNet(doc, null);
  const coils = {}, masters = {};
  for (const c of doc.comps) {
    const ty = TYPES[c.type];
    if (!ty) continue;
    const k = tk(c.tag);
    if (ty.fam === 'coil') { if (coils[k]) out.push({ id: c.id, msg: `Due bobine con la stessa sigla ${c.tag}: i contatti ${c.tag} seguono solo la prima.` }); coils[k] = c; masters[k] = 1; }
    if (ty.fam === 'prot' && ty.prot !== 'fuse') masters[k] = 1;
    if (ty.fam === 'cyl') { masters[k + '0'] = 1; masters[k + '1'] = 1; }
  }
  for (const c of doc.comps) {
    const ty = TYPES[c.type];
    if (!ty) continue;
    if (!ty.noTag && ty.fam !== 'text' && !String(c.tag || '').trim()) out.push({ id: c.id, msg: `${ty.name} senza sigla.` });
    if (ty.fam === 'contact' && !ty.man && !masters[tk(c.tag)]) out.push({ id: c.id, msg: `Il contatto ${c.tag || '(senza sigla)'} non ha una bobina o un apparecchio con la stessa sigla: in simulazione non si muoverà.` });
  }
  let open = 0; const openIds = new Set();
  for (const c of doc.comps) {
    const m = NL.termV[c.id]; if (!m || TYPES[c.type].fam === 'sup') continue;
    for (const t in m) { const v = m[t]; if (!NL.deg[v] && NL.tcount.get(v) === 1) { open++; openIds.add(c.id); } }
  }
  if (open) out.push({ ids: [...openIds], msg: `${open} morsett${open === 1 ? 'o' : 'i'} non collegat${open === 1 ? 'o' : 'i'} (cerchietti arancioni sul foglio).` });
  return out;
}

function newComp(type, x, y, tag, props, rot) {
  const ty = TYPES[type];
  return { id: uid('c'), type, x, y, rot: rot || 0, tag: tag == null ? '' : tag, props: Object.assign(JSON.parse(JSON.stringify(ty.props)), props || {}) };
}
function exBuild(title, fn) {
  const doc = { v: 1, title, comps: [], wires: [] };
  const add = (type, x, y, tag, props, rot) => { const c = newComp(type, x, y, tag, props, rot); doc.comps.push(c); return c; };

  return doc;
}

/* =========================================================================
   QuadroSim — disegno SVG (funzioni pure: stato -> stringa SVG)
   ========================================================================= */

/* numerazione automatica dei contatti ausiliari (IEC 60947): per ogni sigla,
   in ordine da sinistra a destra: NA x3-x4, NC x1-x2, temporizzati NA x7-x8 / NC x5-x6 */
function contactNums(doc) {
  const by = {};
  for (const c of doc.comps) {
    const ty = TYPES[c.type];
    if (!ty || ty.fam !== 'contact' || ty.kind === 'NO3' || ty.kind === 'INV' || ty.fixedNums) continue;
    const k = tk(c.tag); (by[k] = by[k] || []).push(c);
  }
  const out = {};
  for (const k in by) {
    by[k].sort((a, b) => a.x - b.x || a.y - b.y).forEach((c, i) => {
      const n = i + 1, ty = TYPES[c.type];
      if (ty.kind === 'CO') out[c.id] = [n + '1', n + '4', n + '2'];
      else if (ty.delayed) out[c.id] = ty.kind === 'NO' ? [n + '7', n + '8'] : [n + '5', n + '6'];
      else out[c.id] = ty.kind === 'NO' ? [n + '3', n + '4'] : [n + '1', n + '2'];
    });
  }
  return out;
}
function coilVariants(doc) {
  const m = {};
  for (const c of doc.comps) { const ty = TYPES[c.type]; if (ty && ty.fam === 'coil') { const k = tk(c.tag); if (!m[k]) m[k] = ty.variant; } }
  return m;
}
function termLabels(c, ctx) {
  const ty = TYPES[c.type];
  if (ty.tnum) return ty.tnum(c);
  if (ty.fixedNums) return ty.fixedNums;
  if (ty.fam === 'contact' && ctx.nums && ctx.nums[c.id]) return ctx.nums[c.id];
  return ty.terms.map(t => (t.n == null ? '' : t.n));
}
const compRot = c => (TYPES[c.type].norot ? 0 : c.rot || 0);

function textEl(x, y, s, cls, anchor, fs) {
  return `<text x="${f2(x)}" y="${f2(y)}"${cls ? ` class="${cls}"` : ''}${anchor && anchor !== 'start' ? ` text-anchor="${anchor}"` : ''}${fs ? ` style="font-size:${fs}px"` : ''}>${esc(s)}</text>`;
}
/* testi del simbolo: restano sempre orizzontali, la posizione ruota con il simbolo */
function symText(c, t) {
  const rot = compRot(c);
  const [dx, dy] = rotPt(t.x, t.y, rot);
  let X = c.x + dx, Y = c.y + dy, a = t.a || 'middle';
  if (t.side) {
    const [ox, oy] = rotPt(t.x - (t.rx || 0), t.y - (t.ry || 0), rot);
    if (Math.abs(ox) >= Math.abs(oy)) a = ox < 0 ? 'end' : 'start';
    else { a = 'middle'; if (oy > 0) Y += (t.fs || 11) * 0.8; }
  }
  return textEl(X, Y, t.s, t.cls, a, t.fs);
}
/* sigla e dati principali, a lato del simbolo (sopra/sotto se ruotato) */
function tagBlock(c, ctx) {
  const ty = TYPES[c.type];
  if (ty.noTag) return '';
  const lines = [];
  const tg = ty.labelText ? ty.labelText(c) : c.tag || '';
  if (tg) lines.push([tg, 'lb']);
  const inf = ty.info ? ty.info(c) : '';
  if (inf && ctx.info !== false) lines.push([inf, 'li']);
  if (!lines.length) return '';
  const b = ty.boxOf ? ty.boxOf(c) : ty.box, rot = compRot(c);
  const [ox, oy] = rotPt(b[0] - 3, lines.length > 1 ? -1 : 4, rot);
  let X = c.x + ox, Y = c.y + oy, a, step = 10.5;
  if (Math.abs(ox) >= Math.abs(oy)) a = ox < 0 ? 'end' : 'start';
  else { a = 'middle'; if (oy < 0) Y -= (lines.length - 1) * step; else Y += 9; }
  return lines.map((l, i) => textEl(X, Y + i * step, l[0], l[1], a)).join('');
}
function termLabelSVG(c, ctx) {
  const ty = TYPES[c.type], labs = termLabels(c, ctx), rot = compRot(c);
  let s = '';
  ty.terms.forEach((t, i) => {
    const txt = labs[i];
    if (!txt) return;
    const inward = t.y < 0 ? 1 : t.y > 0 ? -1 : 0;
    const [tx, ty2] = termPos(c, t);
    if (rot === 0 || rot === 180) {
      const [dx, dy] = rotPt(3.5, inward * 8 + (inward > 0 ? 1 : 0), rot);
      s += textEl(tx + dx, ty2 + dy + (rot === 180 && inward > 0 ? 3 : 0), txt, 'tn', dx >= 0 ? 'start' : 'end');
    } else {
      const [dx] = rotPt(0, inward * 7, rot);
      s += textEl(tx + dx, ty2 + 8.5, txt, 'tn', 'middle');
    }
  });
  return s;
}

/* stato visivo di un componente durante la simulazione */
function visOf(S, c) {
  if (!S) return null;
  const ty = TYPES[c.type], v = {};
  const hiddenHere = S.hidden && S.hidden.id === c.id && !S.hiddenShown;
  v.fx = !!S.fx[c.id] && !hiddenHere;
  switch (ty.fam) {
    case 'contact':
      v.act = actuated(S, c);
      if (ty.kind === 'CO' || ty.kind === 'INV') v.closed = S.fx[c.id] === 'stuck1' ? true : v.act;
      else v.closed = contactClosed(S, c);
      break;
    case 'coil': {
      const ld = S.ld[c.id], co = S.co[tk(c.tag)];
      v.en = ld.on; v.burnt = ld.burnt || (S.fx[c.id] === 'open' && !hiddenHere);
      if (co) { v.acc = co.acc; v.dact = co.dact; }
      break;
    }
    case 'prot': {
      const st = S.pd[c.id];
      v.on = st.on; v.trip = st.trip; v.heat = st.heat; v.blown = st.blown;
      if (ty.prot === 'fuse') v.heat = Math.max(...st.hp);
      break;
    }
    case 'lamp': { const ld = S.ld[c.id]; v.on = ld.on; v.dim = ld.dim; v.burnt = ld.burnt || (S.fx[c.id] === 'open' && !hiddenHere); break; }
    case 'motor': { const m = S.mo[c.id]; Object.assign(v, { st: m.st, spin: m.speed > 0.01, dir: m.dir, conn: m.conn }); v.fx = v.fx || m.ol || m.lock || !!m.earth || m.openW; break; }
    case 'xf': { const ld = S.ld[c.id]; v.on = ld.on; v.burnt = ld.burnt; break; }
    case 'cyl': { const cy = S.cy[tk(c.tag)]; v.pos = cy ? cy.pos : 0; break; }
  }
  return v;
}

/* note di stato accanto ai componenti in simulazione */
function simNotes(S, c) {
  const ty = TYPES[c.type], b = compBox(c), notes = [];
  if (ty.fam === 'motor') {
    const m = S.mo[c.id];
    if (m.st === 'run') notes.push([(m.dir > 0 ? '↻ orario' : '↺ antiorario') + (m.conn ? (m.conn === 'Y' ? ', stella' : ', triangolo') : ''), 'sn ok']);
    else if (m.st === 'stall') notes.push(['bloccato', 'sn warn']);
    if (m.ol) notes.push(['sovraccarico', 'sn warn']);
    if (m.frameV > 50) notes.push([`massa a ${Math.round(m.frameV)} V`, 'sn err']);
    if (m.touch) notes.push([`persona: ${fmtA(m.bodyI)}`, m.bodyLv === 2 ? 'sn err' : m.bodyLv === 1 ? 'sn warn' : 'sn ok']);
  } else if (ty.fam === 'prot') {
    const st = S.pd[c.id];
    if (ty.prot === 'fuse' && st.blown.some(x => x)) notes.push(['interrotto', 'sn err']);
    else if (st.trip && ty.prot === 'ft') notes.push(['intervenuto', 'sn err']);
    else if (st.trip) notes.push(['scattato', 'sn err']);
    else if (ty.prot !== 'fuse' && ty.prot !== 'ft' && !st.on) notes.push(['aperto', 'sn']);
  } else if (ty.fam === 'coil' && S.ld[c.id].burnt) notes.push(['bruciata', 'sn err']);
  else if (ty.fam === 'lamp' && S.ld[c.id].burnt) notes.push(['bruciata', 'sn err']);
  else if (ty.fam === 'xf' && S.ld[c.id].burnt) notes.push(['guasto', 'sn err']);
  if (ty.fam === 'coil' && (ty.variant === 'ton' || ty.variant === 'tof')) {
    const co = S.co[tk(c.tag)], T = +c.props.t || 0;
    const rest = co ? Math.max(0, T - co.acc).toFixed(1).replace('.', ',') + ' s' : '';
    if (co && ty.variant === 'ton' && co.en && !co.dact) notes.push([rest, 'sn']);
    if (co && ty.variant === 'tof' && !co.en && co.dact) notes.push([rest, 'sn']);
  }
  if (!notes.length) return '';
  const x = (b[0] + b[2]) / 2, y = b[3] + 11;
  return notes.map((n, i) => textEl(x, y + i * 10, n[0], n[1], 'middle')).join('');
}

function compSVG(c, ctx, v) {
  const ty = TYPES[c.type];
  if (!ty) return '';
  const d = ty.draw(c, v, { delayKind: ctx.cv ? ctx.cv[tk(c.tag)] : null });
  const rot = compRot(c), sel = ctx.sel && ctx.sel.has(c.id), hl = ctx.hl === c.id;
  let s = `<g class="cp" transform="translate(${c.x},${c.y})${rot ? ` rotate(${rot})` : ''}">`;
  if (sel || hl) { const b = ty.boxOf ? ty.boxOf(c) : ty.box; s += RC(b[0] - 4, b[1] - 4, b[2] - b[0] + 8, b[3] - b[1] + 8, hl ? 'hlbox' : 'selbox'); }
  s += d.g + '</g>';
  for (const t of d.tx) s += symText(c, t);
  s += tagBlock(c, ctx);
  if (ctx.tnums !== false) s += termLabelSVG(c, ctx);
  if (ctx.S) s += simNotes(ctx.S, c);
  return s;
}
function renderCtx(doc, o) {
  return { nums: contactNums(doc), cv: coilVariants(doc), sel: o.sel || new Set(), S: o.S || null, hl: o.hl || null, info: o.info, tnums: o.tnums };
}

/* fili, pallini di giunzione e morsetti liberi */
function wireLayer(doc, o) {
  const S = o.S || null, NL = o.NL, sel = o.sel || new Set();
  let wires = '', halo = '';
  if (!S) {
    for (const w of doc.wires) {
      const pts = w.pts.map(p => p[0] + ',' + p[1]).join(' ');
      if (sel.has(w.id)) halo += `<polyline points="${pts}" class="wh"/>`;
      wires += `<polyline points="${pts}" class="w"/>`;
    }
  } else {
    const V = NL.vPos, cls = S.netCls || [], eI = S.edgeI;
    NL.edges.forEach((e, k) => {
      const a = V[e.a], b = V[e.b], n = NL.netOf[e.a], cc = cls[n] || '';
      const I = eI ? eI[k] : 0;
      const c2 = 'w' + (cc ? ' ' + cc : '') + (I > 0.0005 && cc !== 'short' ? ' cur' : '');
      wires += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${c2}"/>`;
    });
    for (const w of doc.wires) {
      if (!S.wfx.has(w.id)) continue;
      const hidden = S.hidden && S.hidden.wire === w.id && !S.hiddenShown;
      const pts = w.pts.map(p => p[0] + ',' + p[1]).join(' ');
      wires += `<polyline points="${pts}" class="w${hidden ? '' : ' brk'}"/>`;
      if (!hidden) { const i = Math.floor((w.pts.length - 1) / 2), p = w.pts[i], q = w.pts[i + 1]; wires += CI((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, 4.5, 'brkm'); }
    }
  }
  let dots = '';
  if (NL) {
    NL.vPos.forEach((p, i) => { if (NL.deg[i] + (NL.tcount.get(i) || 0) >= 3 && NL.deg[i] >= 2) dots += CI(p[0], p[1], 2.7, 'jd'); });
    if (!S && o.hints !== false) {
      for (const c of doc.comps) {
        const m = NL.termV[c.id]; if (!m || TYPES[c.type].fam === 'sup') continue;
        for (const t in m) { const v = m[t]; if (!NL.deg[v] && NL.tcount.get(v) === 1) { const p = NL.vPos[v]; dots += CI(p[0], p[1], 3.2, 'ot'); } }
      }
    }
  }
  return halo + wires + dots;
}

/* disegno completo del foglio (stampa) */
function renderDoc(doc, o) {
  const ctx = renderCtx(doc, o);
  let comps = '';
  for (const c of doc.comps) comps += compSVG(c, ctx, visOf(o.S, c));
  return wireLayer(doc, o) + comps;
}

function docBounds(doc) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const c of doc.comps) { const b = compBox(c); x0 = Math.min(x0, b[0] - 40); y0 = Math.min(y0, b[1] - 16); x1 = Math.max(x1, b[2] + 10); y1 = Math.max(y1, b[3] + 22); }
  for (const w of doc.wires) for (const p of w.pts) { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); }
  if (!isFinite(x0)) return null;
  return [x0, y0, x1, y1];
}

/* anteprima di un simbolo per la tavolozza */
function paletteSVG(entry) {
  const ty = TYPES[entry.type];
  const c = { id: 'pv', type: entry.type, x: 0, y: 0, rot: 0, tag: '', props: Object.assign({}, ty.props, entry.props || {}) };
  if (entry.type === 'text') return '<svg viewBox="0 0 40 40" class="pv sch" aria-hidden="true"><text x="20" y="27" text-anchor="middle" class="note" style="font-size:22px">Aa</text></svg>';
  const b = ty.box, pad = 5;
  const d = ty.draw(c, null, {});
  let tx = '';
  for (const t of d.tx) tx += symText(c, t);
  const w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;
  return `<svg viewBox="${b[0] - pad} ${b[1] - pad} ${w} ${h}" class="pv sch" aria-hidden="true">${d.g}${tx}</svg>`;
}

/* =========================================================================
   QuadroSim — interfaccia: editor touch, simulazione, file
   ========================================================================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const SVGNS = 'http://www.w3.org/2000/svg';
const DT = 0.02;
const LS_AUTO = 'quadrosim.auto.v1', LS_ARCH = 'quadrosim.archivio.v1';
const store = {
  get(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const mq = q => { try { return window.matchMedia(q).matches; } catch (e) { return false; } };
const isNarrow = () => mq('(max-width: 960px)');
const isTouch = mq('(pointer: coarse)');
const RM = mq('(prefers-reduced-motion: reduce)');

let DL = null; // salvataggio dei file quando la pagina gira dentro claude.ai
if (EMBED) { try { window.claude.use('downloads').then(ns => { DL = ns; }, () => {}); } catch (e) { /* niente */ } }

  view: { z: 1, tx: 60, ty: 60 },

  NL: null, lastFrame: 0, acc: 0, needRender: false, haltShown: false, hiddenTries: 0, wKey: '',
};

const cv = $('#cv'), world = $('#world'), stage = $('#stage');
const mk = (tag, attrs) => { const e = document.createElementNS(SVGNS, tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const Lw = mk('g'), Lc = mk('g'), Lo = mk('g', { class: 'ov' });
world.append(Lw, Lc, Lo);
const compEls = new Map(), compStr = new Map();

/* =========================================================================
   Documento
   ========================================================================= */
const getComp = id => A.doc.comps.find(c => c.id === id);
const getWire = id => A.doc.wires.find(w => w.id === id);
const newDoc = () => ({ v: 1, title: 'Schema senza titolo', comps: [], wires: [] });
const snapshot = () => JSON.stringify(A.doc);

function simplify(p) {
  const out = [];
  for (const q of p) { const l = out[out.length - 1]; if (l && l[0] === q[0] && l[1] === q[1]) continue; out.push([q[0], q[1]]); }
  for (let i = 1; i < out.length - 1;) {
    const a = out[i - 1], b = out[i], c = out[i + 1];
    if ((a[0] === b[0] && b[0] === c[0]) || (a[1] === b[1] && b[1] === c[1])) out.splice(i, 1); else i++;
  }
  return out;
}
const segLen = p => { let s = 0; for (let i = 0; i < p.length - 1; i++) s += Math.abs(p[i + 1][0] - p[i][0]) + Math.abs(p[i + 1][1] - p[i][1]); return s; };
function cleanWires() { A.doc.wires = A.doc.wires.filter(w => { w.pts = simplify(w.pts); return w.pts.length >= 2 && segLen(w.pts) > 0; }); }
function distSeg(x, y, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((x - a[0]) * dx + (y - a[1]) * dy) / l2, 0, 1) : 0;
  return Math.hypot(a[0] + t * dx - x, a[1] + t * dy - y);
}

/* sposta un estremo di un filo mantenendo i tratti ortogonali (end: 0 primo punto, 1 ultimo) */
function dragEnd(orig, end, np) {
  let p = orig.map(q => [q[0], q[1]]);
  if (end) p.reverse();
  const a = p[0], b = p[1];
  np = [np[0], np[1]];
  if (p.length === 2) {
    if (np[0] === b[0] || np[1] === b[1]) p = [np, b];
    else if (a[0] === b[0]) { const ym = snap((np[1] + b[1]) / 2); p = [np, [np[0], ym], [b[0], ym], b]; }
    else { const xm = snap((np[0] + b[0]) / 2); p = [np, [xm, np[1]], [xm, b[1]], b]; }
  } else {
    if (a[0] === b[0]) p[1] = [np[0], b[1]];
    else if (a[1] === b[1]) p[1] = [b[0], np[1]];
    p[0] = np;
  }
  if (end) p.reverse();
  return simplify(p);
}

/* percorso ortogonale tra due punti; dir: 'v' o 'h' = direzione con cui il filo esce dal punto */
function autoRoute(a, b, first) {
  const P0 = [a.x, a.y], P1 = [b.x, b.y];
  if (a.x === b.x || a.y === b.y) return [P0, P1];
  const ad = first || a.dir, bd = b.dir;

  A.S = null; A.pressed.clear(); hidePop();
  $('#toasts').innerHTML = '';
  document.body.classList.remove('sim');
  $('#mainsw').setAttribute('aria-pressed', 'false'); $('#swlab').textContent = 'Simula'; $('#swsub').textContent = 'schema fermo';
  $('#meter').hidden = true;
  A.wKey = ''; render(); showProps(); hint();
}
function simRestart() {
  if (!A.S) return;
  A.S = simCreate(A.doc); A.rot = {}; A.haltShown = false; A.mKey = ''; A.pressed.clear(); A.hiddenTries = 0; A.wKey = '';
  render(); updHidden(); toast('Simulazione ricominciata da capo.');
}
function loop() {
  const S = A.S; if (!S) return;
  requestAnimationFrame(loop);
  const now = performance.now();
  const dtr = A.lastFrame ? Math.min(0.1, (now - A.lastFrame) / 1000) : 0;
  A.lastFrame = now; A.acc += dtr;
  if (S.dirty && A.acc < DT) A.acc = DT; // i comandi rispondono subito
  let ch = false, n = 0;
  while (A.acc >= DT && n < 12 && !S.halt) { if (simStep(S, DT)) ch = true; A.acc -= DT; n++; }
  if (n >= 12) A.acc = 0;
  if (S.evts.length) { for (const e of S.evts) if (e.kind !== 'info') toast(e.msg, e.kind); S.evts.length = 0; }
  if (S.halt && !A.haltShown) { A.haltShown = true; ch = true; showHalt(); }
  if (ch || A.needRender) { A.needRender = false; render(); }
  spinRotors(dtr);
  $('#simclock').textContent = fmtClock(S.t);
  updMeter();
}
function spinRotors(dt) {
  if (RM) return;
  const S = A.S;
  for (const c of S.motors) {
    const m = S.mo[c.id]; if (m.speed <= 0.01) continue;
    A.rot[c.id] = ((A.rot[c.id] || 0) + m.dir * m.speed * 240 * dt) % 360;
    const el = compEls.get(c.id), r = el && el.querySelector('.rotor');
    if (r) r.setAttribute('transform', `rotate(${f2(A.rot[c.id])})`);
  }
}
function fmtClock(t) { const m = Math.floor(t / 60), s = t - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0').replace('.', ','); }
function setSimTool(t) {
  A.simTool = t;
  $$('#simtools button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.st === t)));
  $('#meter').hidden = t !== 'meter';
  A.mKey = ''; renderOverlay(); updMeter(); hint();
}
function simTap(g, w) {
  const S = A.S, c = g.comp;
  if (A.simTool === 'meter') { setProbe(w); return; }
  if (A.simTool === 'fault') { if (c) faultMenu(c, g.sx, g.sy); else if (g.hw) wireMenu(g.hw.w, g.sx, g.sy); return; }
  if (!c) return;
  const ty = TYPES[c.type], k = tk(c.tag);
  if (ty.man && S.link[k]) { toast(S.link[k].kind.startsWith('cyl') ? 'Questo finecorsa è azionato dallo stelo del cilindro.' : `La sigla ${c.tag} è anche di una bobina: il contatto segue quella.`); return; }
  if (ty.man === 'latch' || ty.man === 'toggle') { simToggle(S, c); A.needRender = true; return; }
  if (ty.fam === 'prot') { const m = simProtTap(S, c); if (m) toast(m); A.needRender = true; return; }
  if (ty.fam === 'contact') { toast(S.link[k] ? `Questo contatto si muove con ${c.tag}.` : `Nessuna bobina ${c.tag || ''} comanda questo contatto.`); return; }
  if (ty.fam === 'motor') toast('Tieni premuto sul motore per i guasti e per il contatto con la carcassa.');
}

/* ---------- tester ---------- */
function probeAt(w) {
  const tol = 18 / A.view.z, ctx = { nums: contactNums(A.doc) };
  let best = null, bd = tol;
  for (const c of A.doc.comps) {
    const ty = TYPES[c.type], labs = termLabels(c, ctx);
    ty.terms.forEach((t, i) => {
      const p = termPos(c, t), d = Math.hypot(p[0] - w[0], p[1] - w[1]);
      if (d < bd) { bd = d; best = { x: p[0], y: p[1], lab: (c.tag || ty.name) + (labs[i] ? ' morsetto ' + labs[i] : '') }; }
    });
  }
  if (best) return best;
  const hw = hitWire(w, tol);
  if (hw) {
    const a = hw.w.pts[hw.i], b = hw.w.pts[hw.i + 1];
    const q = a[1] === b[1] ? [clamp(w[0], Math.min(a[0], b[0]), Math.max(a[0], b[0])), a[1]] : [a[0], clamp(w[1], Math.min(a[1], b[1]), Math.max(a[1], b[1]))];
    return { x: q[0], y: q[1], lab: 'un filo' };
  }
  return null;
}
function setProbe(w) {
  const p = probeAt(w);
  if (!p) { toast('Tocca un morsetto o un filo per appoggiare il puntale.'); return; }
  const P = A.probes;
  if (!P.r || P.b) { P.r = p; P.b = null; } else P.b = p;
  A.mKey = ''; renderOverlay(); updMeter();
}
function probeVertex(S, p) {
  const NL = S.NL, v = NL.vKey.get((Math.round(p.x * 10) / 10) + ',' + (Math.round(p.y * 10) / 10));
  if (v !== undefined && (NL.deg[v] > 0 || NL.tcount.get(v))) return v;
  let best = null, bd = 0.6;
  for (const e of NL.edges) { const d = distSeg(p.x, p.y, NL.vPos[e.a], NL.vPos[e.b]); if (d < bd) { bd = d; best = e.a; } }
  return best;
}
const fmtMeterV = V => (V < 0.05 ? '0,0' : V < 100 ? V.toFixed(1).replace('.', ',') : String(Math.round(V)));
function fmtMeterR(R) {
  if (!isFinite(R) || R > 2e7) return ['OL', ''];
  if (R < 1) return [R.toFixed(2).replace('.', ','), 'Ω'];
  if (R < 1000) return [R.toFixed(1).replace('.', ','), 'Ω'];
  if (R < 1e6) return [(R / 1000).toFixed(2).replace('.', ','), 'kΩ'];
  return [(R / 1e6).toFixed(2).replace('.', ','), 'MΩ'];
}
function updMeter() {
  const S = A.S; if (!S || A.simTool !== 'meter') return;
  const P = A.probes;
  const key = S.solN + '|' + A.mMode + '|' + (P.r ? P.r.x + ',' + P.r.y : '') + '|' + (P.b ? P.b.x + ',' + P.b.y : '');
  if (key === A.mKey) return;
  A.mKey = key;
  let txt = '– – –', unit = '', msg = '';
  if (P.r && P.b) {
    const r = meterRead(S, probeVertex(S, P.r), probeVertex(S, P.b), A.mMode);
    if (!r) msg = 'Un puntale non tocca un conduttore collegato.';
    else if (r.err) { txt = '– – –'; msg = r.err; }
    else if (A.mMode === 'V') { txt = fmtMeterV(r.V); unit = 'V'; }
    else { const f = fmtMeterR(r.R); txt = f[0]; unit = f[1]; if (f[0] === 'OL') msg = 'Circuito aperto: tra i due punti non c\'è continuità.'; }
  } else if (P.r) msg = 'Ora tocca il secondo punto.';
  $('#m-lcd').innerHTML = esc(txt) + (unit ? `<small>${esc(unit)}</small>` : '');
  $('#m-r').textContent = 'Rosso: ' + (P.r ? P.r.lab : 'tocca un morsetto o un filo');
  $('#m-b').textContent = 'Nero: ' + (P.b ? P.b.lab : '—');
  $('#m-msg').textContent = msg;
}
function setMMode(m) {
  A.mMode = m; $('#m-v').setAttribute('aria-pressed', String(m === 'V')); $('#m-o').setAttribute('aria-pressed', String(m === 'R'));
  A.mKey = ''; updMeter();
}

/* ---------- guasti ---------- */
function faultMenu(c, x, y, fromHold) {
  const S = A.S; if (!S) return;
  const ty = TYPES[c.type], fx = S.fx[c.id], items = [];
  const title = (ty.name + ' ' + (c.tag || '')).trim();
  if (S.hidden && !S.hiddenShown && !(fromHold && ty.fam === 'motor')) { guessMenu({ id: c.id }, title, x, y); return; }
  const setFx = (k, what) => {
    if (k) S.fx[c.id] = k; else delete S.fx[c.id];
    if (!k && S.hidden && S.hidden.id === c.id) S.hidden = null;
    S.dirty = true; evt(S, `${tagOf(c)}: ${what}`); A.needRender = true; updHidden();
  };
  if (ty.fam === 'contact') {
    items.push({ label: 'Funziona normalmente', chk: !fx, act: () => setFx(null, 'riparato') });
    items.push({ label: 'Contatto interrotto', sub: 'non chiude mai il circuito', chk: fx === 'stuck0', act: () => setFx('stuck0', 'contatto interrotto') });
    if (ty.kind !== 'INV') items.push({ label: 'Contatto incollato', sub: 'resta sempre chiuso', chk: fx === 'stuck1', act: () => setFx('stuck1', 'contatto incollato') });
  } else if (ty.fam === 'coil' || ty.fam === 'lamp' || ty.fam === 'term') {
    const what = ty.fam === 'coil' ? 'Bobina interrotta' : ty.fam === 'lamp' ? (c.type === 'buz' ? 'Sirena guasta' : 'Lampada bruciata') : 'Morsetto allentato';
    items.push({ label: 'Funziona normalmente', chk: !fx, act: () => setFx(null, 'riparato') });
    items.push({ label: what, sub: 'il circuito resta aperto', chk: fx === 'open', act: () => setFx('open', what.toLowerCase()) });
    const ld = S.ld[c.id];
    if (ld && ld.burnt) items.push({ label: 'Sostituisci il componente bruciato', act: () => { ld.burnt = false; S.dirty = true; evt(S, `${tagOf(c)}: sostituito`); A.needRender = true; } });
  } else if (ty.fam === 'motor') {
    const m = S.mo[c.id];
    const tg = (f, what) => () => { f(); S.dirty = true; evt(S, `${tagOf(c)}: ${what}`); A.needRender = true; };
    items.push({ label: 'Sovraccarico meccanico', sub: 'la corrente assorbita sale dell\'80%', chk: m.ol, act: tg(() => { m.ol = !m.ol; }, m.ol ? 'fine del sovraccarico' : 'sovraccarico meccanico') });
    items.push({ label: 'Rotore bloccato', sub: 'non gira e assorbe molta corrente', chk: m.lock, act: tg(() => { m.lock = !m.lock; }, m.lock ? 'rotore sbloccato' : 'rotore bloccato') });
    items.push({ label: 'Avvolgimento interrotto', sub: 'una fase del motore è aperta', chk: m.openW, act: tg(() => { m.openW = !m.openW; }, m.openW ? 'avvolgimento riparato' : 'avvolgimento interrotto') });
    items.push({ label: 'Guasto a massa franco', sub: 'una fase tocca la carcassa', chk: m.earth === 1, act: tg(() => { m.earth = m.earth === 1 ? 0 : 1; }, m.earth === 1 ? 'guasto a massa eliminato' : 'guasto a massa franco') });
    items.push({ label: 'Dispersione verso massa', sub: 'isolamento degradato, circa 2 kΩ', chk: m.earth === 2, act: tg(() => { m.earth = m.earth === 2 ? 0 : 2; }, m.earth === 2 ? 'dispersione eliminata' : 'dispersione verso massa') });
    items.push({ sep: true });
    items.push({ label: 'Una persona tocca la carcassa', sub: 'corpo umano di circa 1 kΩ verso terra', chk: m.touch, act: () => { m.touch = !m.touch; S.dirty = true; A.needRender = true; } });
  } else if (ty.prot === 'id') {
    items.push({ label: 'Premi il tasto di prova T', sub: 'il differenziale deve aprirsi', act: () => { simTest(S, c); A.needRender = true; } });
  }
  if (!items.length) { toast('Per questo componente non ci sono guasti da simulare.'); return; }
  popMenu(x + 14, y + 14, items, title, true);
}
function wireMenu(w, x, y) {
  const S = A.S;
  if (S.hidden && !S.hiddenShown) { guessMenu({ wire: w.id }, 'Filo', x, y); return; }
  const br = S.wfx.has(w.id);
  popMenu(x + 14, y + 14, [
    { label: 'Filo integro', chk: !br, act: () => { setWireBreak(S, w.id, false); if (S.hidden && S.hidden.wire === w.id) S.hidden = null; evt(S, 'Filo riparato'); A.needRender = true; updHidden(); } },
    { label: 'Filo interrotto', sub: 'conduttore tagliato o morsetto non serrato', chk: br, act: () => { setWireBreak(S, w.id, true); evt(S, 'Filo interrotto'); A.needRender = true; } },
  ], 'Filo', true);
}
function guessMenu(tgt, title, x, y) {
  popMenu(x + 14, y + 14, [{
    label: 'È questo il guasto', sub: 'segnalalo e riparalo',
    act: () => {
      const S = A.S, h = S && S.hidden; if (!h) return;

        S.hidden = null; S.dirty = true;
        evt(S, 'Guasto trovato e riparato: ' + h.desc);
        toast(`Esatto: ${h.desc}. Guasto riparato${A.hiddenTries ? ` dopo ${A.hiddenTries} tentativi sbagliati` : ' al primo tentativo'}.`, 'ok', 8000);
        A.hiddenTries = 0;
      } else {
        A.hiddenTries++;
        toast(`No, qui è tutto a posto (tentativi sbagliati: ${A.hiddenTries}). Continua a misurare con il tester.`, 'warn');
      }

  }], title, true);
}
function updHidden() {
  const S = A.S;
  $('#hidlab').textContent = S && S.hidden && !S.hiddenShown ? 'Mostra il guasto' : 'Guasto nascosto';
}
function hiddenClick() {
  const S = A.S; if (!S) return;

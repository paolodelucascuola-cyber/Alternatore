    evt(S, 'Soluzione mostrata: ' + S.hidden.desc);
    toast('Il guasto era: ' + S.hidden.desc + '. Ora è evidenziato sul foglio.', 'warn', 9000);
    updHidden(); return;
  }
  if (S.hidden) { if (S.hidden.wire) setWireBreak(S, S.hidden.wire, false); else delete S.fx[S.hidden.id]; S.hidden = null; S.dirty = true; }
  const h = randomFault(S);
  if (!h) { toast('Lo schema è vuoto: non c\'è niente da guastare.'); return; }
  A.hiddenTries = 0; A.needRender = true; A.wKey = '';
  evt(S, 'Guasto nascosto inserito');
  toast('Guasto nascosto inserito. Fai funzionare lo schema, misura con il tester e segnala il componente difettoso con lo strumento Guasti.', 'warn', 9000);

}
function showLog() {

function showHalt() {

  openModal(`<h2>Cortocircuito</h2><div class="warnbox"><p>${esc(S.halt.msg)}</p></div><p>I conduttori interessati lampeggiano in fucsia sul foglio.</p><div class="acts"><button class="btn" data-act="edit">Torna al disegno</button><button class="btn pri" data-act="again">Ricomincia la simulazione</button></div>`, card => {

/* =========================================================================
   Menu, finestre e avvisi
   ========================================================================= */
function popMenu(x, y, items, title, guard) {
  hidePop();
  const t0 = performance.now();
  const veil = document.createElement('div'); veil.id = 'veil';
  veil.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); hidePop(); });
  const pop = document.createElement('div'); pop.id = 'pop'; pop.className = 'card'; pop.setAttribute('role', 'menu');
  const hasChk = items.some(o => o.chk !== undefined);
  let h = title ? `<div class="ttl">${esc(title)}</div>` : '';
  items.forEach((it, i) => {
    if (it.sep) { h += '<div class="hr"></div>'; return; }
    h += `<button role="menuitem" data-i="${i}">${hasChk ? `<span class="chk">${it.chk ? '✓' : ''}</span>` : ''}<span><span>${esc(it.label)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></button>`;
  });
  pop.innerHTML = h;
  pop.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    if (guard && performance.now() - t0 < 350) return;
    const it = items[+b.dataset.i]; hidePop(); if (it && it.act) it.act();
  });
  document.body.append(veil, pop);
  const r = pop.getBoundingClientRect(), W = window.innerWidth, H = window.innerHeight;
  pop.style.left = clamp(x, 8, Math.max(8, W - r.width - 8)) + 'px';
  pop.style.top = clamp(y + r.height > H - 8 ? y - r.height - 20 : y, 8, Math.max(8, H - r.height - 8)) + 'px';
  const f = pop.querySelector('button'); if (f && !isTouch) f.focus();
}
function hidePop() { const p = $('#pop'), v = $('#veil'); if (p) p.remove(); if (v) v.remove(); }
function openModal(html, setup) {
  closeModal(); hidePop();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${html}</div>`;
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(); });
  m.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.body.appendChild(m);
  const card = m.firstElementChild;
  if (setup) setup(card);
  if (!isTouch) { const f = card.querySelector('input, .pri, button'); if (f) f.focus(); }
  return card;
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function toast(msg, kind, ms) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : ''); t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 4) box.firstElementChild.remove();
  setTimeout(() => t.remove(), ms || (kind === 'err' || kind === 'trip' ? 6500 : 4000));
}

/* ---------- file ---------- */
function docFileName() { return String(A.doc.title || 'schema').replace(/[\\/:*?"<>|]+/g, '').trim().slice(0, 60) || 'schema'; }
function docJSON() { return JSON.stringify({ app: 'QuadroSim', v: 1, title: A.doc.title, comps: A.doc.comps, wires: A.doc.wires }); }
function saveFile() {
  const name = docFileName() + '.json';
  if (EMBED) {
    if (!DL) { toast('Qui non si possono scaricare file: usa «Salvataggi su questo dispositivo».', 'err'); return; }
    DL.save({ filename: name, data: docJSON() }).then(() => toast('File salvato: ' + name, 'ok'), e => {
      if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') { toast('Aspetta un attimo e riprova.'); return; }
      toast('Il salvataggio del file non è disponibile qui: usa «Salvataggi su questo dispositivo».', 'err');
    });
    return;
  }
  const blob = new Blob([docJSON()], { type: 'application/json' });
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 3000);
}
function canShare() {
  if (EMBED) return false;
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] })); } catch (e) { return false; }
}
async function shareFile() {
  try {
    const f = new File([docJSON()], docFileName() + '.json', { type: 'application/json' });
    await navigator.share({ files: [f], title: A.doc.title });
  } catch (e) { if (!e || e.name !== 'AbortError') saveFile(); }
}
function openFile(f) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || !Array.isArray(d.comps) || !Array.isArray(d.wires)) throw new Error('formato');
      if (!d.title || d.title === 'Schema senza titolo') d.title = f.name.replace(/\.json$/i, '');
      loadDoc(d, true);
      toast('Aperto: ' + A.doc.title);
    } catch (e) { toast('Questo file non è uno schema di QuadroSim.', 'err'); }
  };
  rd.readAsText(f);
}
function newSchema() {
  const go = () => loadDoc(newDoc(), true);
  if (!A.doc.comps.length && !A.doc.wires.length) { go(); return; }
  openModal(`<h2>Nuovo schema</h2><p>Lo schema attuale verrà chiuso. Finché non chiudi la pagina puoi recuperarlo con il tasto Annulla; per conservarlo usa «Salva come file» o i salvataggi sul dispositivo.</p><div class="acts"><button class="btn" data-close>Annulla</button><button class="btn pri" data-act="go">Nuovo schema</button></div>`,
    c => { c.querySelector('[data-act=go]').onclick = () => { closeModal(); go(); }; });
}
function fileMenu() {
  const r = $('#b-file').getBoundingClientRect();

  popMenu(r.left, r.bottom + 6, items, A.doc.title);
}
function archiveModal() {

  const list = names.map((n, i) => `<div class="it"><div><b>${esc(n)}</b><small>${esc(when(arch[n].t))}, ${arch[n].doc && arch[n].doc.comps ? arch[n].doc.comps.length : 0} simboli</small></div><button class="btn" data-open="${i}">Apri</button><button class="btn" data-del="${i}">Elimina</button></div>`).join('');
  openModal(`<h2>Salvataggi su questo dispositivo</h2><p>Restano nel browser di questo dispositivo. Per portare uno schema su un altro iPad usa «Salva come file» o «Condividi il file».</p>
    <input type="text" id="ar-name" value="${esc(A.doc.title)}" aria-label="Nome del salvataggio">
    <div class="acts" style="justify-content:flex-start;margin-top:8px"><button class="btn pri" data-act="save">Salva lo schema attuale</button></div>
    <div class="lst">${list || '<p>Nessuno schema salvato finora.</p>'}</div>
    <div class="acts"><button class="btn" data-close>Chiudi</button></div>`, card => {
    card.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const a2 = store.get(LS_ARCH) || {};
      if (b.dataset.act === 'save') {
        const name = ($('#ar-name').value || '').trim().slice(0, 60) || 'Schema';
        A.doc.title = name; commit();
        a2[name] = { t: Date.now(), doc: JSON.parse(snapshot()) };
        if (store.set(LS_ARCH, a2)) { toast('Salvato su questo dispositivo: ' + name, 'ok'); archiveModal(); }
        else toast('Il browser non permette di salvare qui. Usa «Salva come file».', 'err');
      } else if (b.dataset.open !== undefined) {
        const n = names[+b.dataset.open], it = a2[n];
        if (it) { closeModal(); loadDoc(Object.assign({}, it.doc, { title: n }), true); toast('Aperto: ' + n); }
      } else if (b.dataset.del !== undefined) {
        if (b.dataset.sure) { delete a2[names[+b.dataset.del]]; store.set(LS_ARCH, a2); archiveModal(); }
        else { b.dataset.sure = '1'; b.textContent = 'Conferma'; b.classList.add('pri'); }
      }
    });
  });
}
function renameModal() {
  openModal(`<h2>Nome dello schema</h2><input type="text" id="rn" value="${esc(A.doc.title)}" aria-label="Nome dello schema"><div class="acts"><button class="btn" data-close>Annulla</button><button class="btn pri" data-act="ok">Rinomina</button></div>`, c => {
    const ok = () => { const v = $('#rn').value.trim().slice(0, 80); if (v) { A.doc.title = v; commit(); } closeModal(); };
    c.querySelector('[data-act=ok]').onclick = ok;
    $('#rn').addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });
  });
}
function checkModal() {
  const w = checkDoc(A.doc);
  const body = w.length ? `<ul>${w.map(x => `<li>${esc(x.msg)}</li>`).join('')}</ul>` : '<p>Nessun problema: tutte le sigle sono a posto e tutti i morsetti sono collegati.</p>';
  openModal(`<h2>Controllo dello schema</h2>${body}<div class="acts">${w.length ? '<button class="btn" data-act="sel">Seleziona gli elementi</button>' : ''}<button class="btn pri" data-close>Chiudi</button></div>`, c => {
    const b = c.querySelector('[data-act=sel]');
    if (b) b.onclick = () => {
      const ids = new Set(); w.forEach(x => { if (x.id) ids.add(x.id); (x.ids || []).forEach(i => ids.add(i)); });
      closeModal(); if (A.S) simStop(); A.sel = ids; setTool('sel'); render(); showProps();
    };
  });
}
function examplesModal() {
  openModal(`<h2>Esempi</h2><p>L'esempio prende il posto dello schema attuale; con Annulla torni indietro.</p><div class="lst">${EXAMPLES.map((e, i) => `<button class="it" data-i="${i}"><span class="t"><b>${esc(e.name)}</b><small>${esc(e.desc)}</small></span></button>`).join('')}</div><div class="acts"><button class="btn" data-close>Chiudi</button></div>`, c => {
    c.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-i]'); if (!b) return;
      closeModal();
      const ex = EXAMPLES[+b.dataset.i];
      loadDoc(ex.build(), true);
    });
  });
}
function helpModal() {
  openModal(`<h2>Guida rapida</h2>
    <h3>Disegnare</h3>
    <p>Scegli un simbolo e tocca il foglio per posarlo, oppure trascinalo direttamente sul foglio. Tocca un simbolo per selezionarlo: nel riquadro cambi sigla e valori, lo ruoti, lo duplichi o lo elimini. Trascinalo per spostarlo: i fili collegati lo seguono. Tenendo premuto su un simbolo compare il menu rapido.</p>
    <h3>Collegare</h3>
    <p>Con lo strumento Filo trascina da un morsetto all'altro. In alternativa tocca il punto di partenza, gli angoli e l'arrivo: il filo si chiude da solo quando tocchi un morsetto o un altro filo. Il pallino nero è una giunzione; due fili che si incrociano senza pallino non sono collegati. I cerchietti arancioni sono morsetti ancora liberi. Un simbolo posato sopra un filo lo interrompe tra i suoi morsetti.</p>
    <h3>Sigle</h3>
    <p>Bobina e contatti con la stessa sigla (per esempio KM1) formano un unico apparecchio. I contatti temporizzati seguono il temporizzatore (KT1), i contatti 95-96 e 97-98 seguono il relè termico (FR1), un contatto con la sigla di un interruttore (Q1) ne segue lo stato. Comandi con la stessa sigla, come S1 NA e S1 NC, sono lo stesso pulsante.</p>
    <h3>Simulare</h3>
    <p>Gira l'interruttore giallo in alto a destra. Tieni premuti i pulsanti, tocca selettori, finecorsa e interruttori; tocca un fusibile interrotto per sostituirlo e un relè termico intervenuto per riarmarlo.</p>
    <div class="legend"><span><i style="background:#D62839"></i>in tensione</span><span><i style="background:#1D63C8"></i>neutro o 0 V</span><span><i style="background:#23994A"></i>protezione PE</span><span><i style="background:#E0119A"></i>cortocircuito</span></div>
    <p>I fili più spessi sono percorsi da corrente.</p>
    <h3>Tester e guasti</h3>
    <p>Con il Tester tocca due punti: leggi la tensione (V) oppure, a circuito non alimentato, la resistenza (Ω). Con Guasti tocchi un componente o un filo e scegli il difetto. «Guasto nascosto» ne inserisce uno a caso: trovalo con il tester e segnalalo con lo strumento Guasti.</p>
    <h3>Gesti e salvataggio</h3>
    <p>Con due dita sposti e ingrandisci il foglio. Lo schema resta salvato automaticamente su questo dispositivo; dal menu File lo salvi come file, lo condividi, lo apri o lo stampi in PDF.</p>
    <p>Con la tastiera: <kbd>⌘Z</kbd> annulla, <kbd>R</kbd> ruota, <kbd>Canc</kbd> elimina, <kbd>W</kbd> filo, <kbd>Esc</kbd> interrompe.</p>
    <div class="acts"><button class="btn pri" data-close>Ho capito</button></div>`);
}
function fillPrint() {
  const doc = A.doc, b = docBounds(doc);
  if (!b) { $('#print').innerHTML = ''; return false; }
  const pad = 16, w = b[2] - b[0] + pad * 2, h = b[3] - b[1] + pad * 2;
  const body = renderDoc(doc, { NL: buildNet(doc, null), hints: false });
  let d = '';
  try { d = new Date().toLocaleDateString('it-IT'); } catch (e) { /* niente */ }
  $('#print').innerHTML = `<svg class="sch" xmlns="${SVGNS}" viewBox="${f2(b[0] - pad)} ${f2(b[1] - pad)} ${f2(w)} ${f2(h)}">${body}</svg><div class="foot"><span>${esc(doc.title)}</span><span>${esc(d)}</span></div>`;
  return true;
}
function printDoc() {
  if (EMBED) { toast('La stampa funziona aprendo QuadroSim come pagina web normale, per esempio da GitHub Pages.'); return; }
  if (!fillPrint()) { toast('Il foglio è vuoto: non c\'è niente da stampare.'); return; }
  setTimeout(() => { try { window.print(); } catch (e) { toast('La stampa non è disponibile qui: apri la pagina in Safari.', 'err'); } }, 80);
}

/* =========================================================================
   Tastiera e avvio
   ========================================================================= */
document.addEventListener('keydown', e => {
  const tgt = e.target;
  if (tgt && tgt.closest && tgt.closest('input, textarea, select')) { if (e.key === 'Enter' && tgt.tagName === 'INPUT') tgt.blur(); return; }
  if (e.key === 'Escape') {
    if ($('#modal')) closeModal(); else if ($('#pop')) hidePop(); else if (A.chain) cancelChain(); else if (A.armed) armEntry(null);
    else if (A.sel.size) { A.sel.clear(); render(); showProps(); }
    return;
  }
  if ($('#modal')) return;
  const mod = e.metaKey || e.ctrlKey, k = (e.key || '').toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 's') { e.preventDefault(); saveFile(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod && k === 'p') { e.preventDefault(); printDoc(); return; }
  if (mod || A.S) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); }
  else if (k === 'r') rotateSel();
  else if (k === 'w') setTool('wire');
  else if (k === 'v') setTool('sel');
  else if (k === 'a') setTool('area');
  else if (e.key === 'Enter' && A.chain) endChain();
});

function init() {
  buildPalette();
  $$('#tools button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $$('#simtools button').forEach(b => b.addEventListener('click', () => setSimTool(b.dataset.st)));
  $('#b-undo').onclick = undo; $('#b-redo').onclick = redo;
  $('#b-file').onclick = fileMenu; $('#b-ex').onclick = examplesModal; $('#b-help').onclick = helpModal;
  $('#e-ex').onclick = examplesModal; $('#e-help').onclick = helpModal;
  $('#b-zin').onclick = () => zoomCenter(1.25); $('#b-zout').onclick = () => zoomCenter(0.8); $('#b-fit').onclick = fitView;
  $('#mainsw').onclick = () => (A.S ? simStop() : simStart());
  $('#b-hidden').onclick = hiddenClick; $('#b-log').onclick = showLog; $('#b-reset').onclick = simRestart;
  $('#m-v').onclick = () => setMMode('V'); $('#m-o').onclick = () => setMMode('R');
  $('#m-x').onclick = () => { A.probes = { r: null, b: null }; A.mKey = ''; renderOverlay(); updMeter(); };
  $('#wb-end').onclick = endChain; $('#wb-back').onclick = backChain; $('#wb-cancel').onclick = cancelChain;
  $('#palbtn').onclick = () => document.body.classList.toggle('palopen');
  $('#palclose').onclick = () => document.body.classList.remove('palopen');
  $('#props').addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'close') { A.sel.clear(); render(); showProps(); } else if (a === 'rot') rotateSel(); else if (a === 'dup') duplicateSel(); else if (a === 'del') deleteSel();
  });
  $('#props').addEventListener('change', e => propChange(e.target));
  $('#fin').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) openFile(f); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  window.addEventListener('resize', () => renderOverlay());
  window.addEventListener('beforeprint', fillPrint);

  if (EMBED) document.body.classList.add('embed');
  const saved = store.get(LS_AUTO);
  A.doc = saved && Array.isArray(saved.comps) ? normDoc(saved) : normDoc(EXAMPLES[0].build());
  A.saved = snapshot(); updUndo();
  applyView(); render(); hint();
  requestAnimationFrame(fitView);
}
init();

</script>
